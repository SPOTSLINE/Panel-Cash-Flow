/* ====================== Ordenar cualquier tabla desde el título ======================
   Clic en el título: ascendente / descendente. En tablas con grupos (empresa, rubro, subtotales)
   se ordena dentro de cada grupo. El orden elegido se mantiene cuando la tabla se vuelve a dibujar. */
const ORDEN = {};
function claveTabla(t){ const s=t.closest('section,dialog'); const ts=s?[...s.querySelectorAll('table')]:[t]; return (s?(s.id||'modal'):'x')+':'+ts.indexOf(t)+':'+(t.tHead?t.tHead.rows[0].cells.length:0); }
function valorCelda(td){
  if(!td) return null;
  const pill = td.querySelector('.pill[class*=" l"]'); if(pill){ const m0=pill.className.match(/\bl(\d)\b/); if(m0) return +m0[1]; }
  const inp = td.querySelector('input'); let s = (inp?inp.value:td.textContent).trim();
  if(!s || s==='—' || s==='–' || s==='-') return null;
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{2})/); if(m) return +('20'+m[3]+m[2]+m[1]);
  if(/^hoy$/i.test(s)) return 0;
  m = s.match(/^en (\d+)/); if(m) return -m[1];
  m = s.match(/^(-?)\s*(?:US)?\$?\s*(-?[\d.]+(?:,\d+)?)/);
  if(m && /\d/.test(m[2])){ const n = parseFloat(m[2].replace(/\./g,'').replace(',','.')); if(!isNaN(n)) return (m[1]==='-'||s.startsWith('-')||s.startsWith('−'))? -Math.abs(n) : n; }
  return s.toLowerCase();
}
const filaDato = tr => !tr.className || /\b(usd|pag|pr)\b/.test(tr.className);
function aplicarOrden(t){
  const o = ORDEN[claveTabla(t)]; if(!o || !t.tBodies[0]) return;
  [...t.tHead.rows[0].cells].forEach((th,i)=>{ if(i===o.col) th.dataset.ord=o.dir; else delete th.dataset.ord; });
  const tb = t.tBodies[0], filas = [...tb.rows];
  let tramo = [];
  const cmp = (a,b)=>{ const x=valorCelda(a.cells[o.col]), y=valorCelda(b.cells[o.col]);
    if(x===null && y===null) return 0; if(x===null) return 1; if(y===null) return -1;
    const r = (typeof x==='number' && typeof y==='number') ? x-y : String(x).localeCompare(String(y),'es',{numeric:true});
    return o.dir==='asc'? r : -r; };
  const volcar = ancla => { if(tramo.length>1){ const s=tramo.slice().sort(cmp); if(s.some((r,i)=>r!==tramo[i])) s.forEach(r=>tb.insertBefore(r, ancla)); } tramo = []; };
  filas.forEach(tr=>{ if(filaDato(tr) && tr.cells.length===t.tHead.rows[0].cells.length) tramo.push(tr); else volcar(tr); });
  volcar(null);
}
let ordenando = false;
document.addEventListener('click', e=>{
  const th = e.target.closest('thead th'); if(!th) return;
  const t = th.closest('table'); if(!t || t.classList.contains('cf') || t.classList.contains('nosort')) return;
  const k = claveTabla(t), col = th.cellIndex, prev = ORDEN[k];
  ORDEN[k] = {col, dir: prev && prev.col===col && prev.dir==='asc' ? 'desc' : 'asc'};
  ordenando = true; aplicarOrden(t); ordenando = false;
});
const OBS_ORDEN = new MutationObserver(()=>{ if(ordenando) return; ordenando = true;
  document.querySelectorAll('table').forEach(t=>{ if(!t.classList.contains('cf') && ORDEN[claveTabla(t)]) aplicarOrden(t); });
  OBS_ORDEN.takeRecords(); ordenando = false; });
OBS_ORDEN.observe(document.body, {childList:true, subtree:true});

/* ====================== Presupuesto del día ======================
   Para un día (o varios): qué está atrasado, qué vence, cuánto es lo mínimo para no caer en
   situación límite, cuánto tengo y cuánto falta. "A pagar" arranca en el mínimo y se puede cambiar. */
const PR = {desde:null, hasta:null, montos:{}, cerrados:{}, guardado:null};
const ROW_PRESU = 'presupuestos_v1';
let PRESU_DB = null;
function prClave(){ return PR.desde+'_'+PR.hasta+'_'+st.emp; }
function presuGrupos(){
  const d = PR.desde, hst = PR.hasta, g = {};
  ITEMS.forEach(it=>{
    if(it.tipo!=='egreso' || !empOk(it) || !isPend(it) || planMuerto(it)) return;
    if(it.proyectado && !st.proy) return;
    const v = it.vto || it.fp; if(!v || v>hst) return;
    const k = it.cat+'|'+it.emp+'|'+it.grupo;
    const x = g[k] = g[k] || {k, cat:it.cat, emp:it.emp, socio:it.socio, grupo:it.grupo, its:[], atr:0, per:0, natr:0, nper:0, sint:!!it.sintetico};
    x.its.push(it); if(v<d){ x.atr+=it.monto; x.natr++; } else { x.per+=it.monto; x.nper++; }
  });
  return Object.values(g).map(x=>{
    x.tot = x.atr + x.per;
    const r = REGLAS[x.cat];
    if(r){
      const imp = x.its.slice().sort((a,b)=>(a.vto||a.fp)<(b.vto||b.fp)?-1:1);
      const n = imp.length, k = Math.max(0, n-(r.limite-1));
      x.cuotas = n; x.lim = r.limite; x.kpag = k;
      x.min = imp.slice(0,k).reduce((s,i)=>s+i.monto,0);
      x.niv = n>=r.limite ? 0 : n===r.limite-1 ? 1 : (BASE[x.cat]??4);
      x.regla = k ? `Al ${fdate(hst)} tendría ${n} cuota(s) impaga(s); con ${r.limite} se cae. ${k===1?'Pagar la más vieja':'Pagar las '+k+' más viejas'} deja ${r.limite-1} impaga${r.limite-1===1?'':'s'}.`
                  : `Al ${fdate(hst)} tendría ${n} cuota(s) impaga(s) (límite ${r.limite}): no hace falta pagar para no caer${n===r.limite-1?', pero queda al borde':''}.`;
    } else {
      x.niv = BASE[x.cat] ?? 4;
      if(x.niv<=1){ x.min = x.tot; x.regla = 'Obligatorio: se paga todo (atrasado y lo que vence).'; }
      else if(x.niv===2){ x.min = x.per; x.regla = 'Se paga lo que vence en el período; lo atrasado queda a decidir.'; }
      else { x.min = 0; x.regla = x.niv===3 ? 'A decidir: se puede postergar.' : 'Negociable.'; }
    }
    x.apagar = (x.k in PR.montos) ? PR.montos[x.k] : x.min;
    return x;
  });
}
async function cargarPresuDB(){ if(PRESU_DB || !CONECTADO) return PRESU_DB; try{ PRESU_DB = (await sbLeer(ROW_PRESU)) || {}; }catch(e){ PRESU_DB = {}; } return PRESU_DB; }

      db[prClave()] = reg;
      if(CONECTADO) await sbGuardar(ROW_PRESU, db);
      PRESU_DB = db; PR.guardado = reg; toast(CONECTADO?'Presupuesto guardado.':'Sin conexión: no se guardó.'); renderPresu();
    }catch(e){ toast('No se pudo guardar: '+e.message); bg.disabled=false; }
  };
}
function cambiarRango(){ PR.montos={}; const g = PRESU_DB && PRESU_DB[prClave()]; if(g) PR.montos={...g.montos}; PR.guardado=g||null; renderPresu(); }

/* ---------- Ayuda / instructivo ---------- */
function renderAyuda(){
  const el = document.getElementById('tab-ayuda');
  if(el.dataset.ok) return;
  el.dataset.ok = '1';
  el.innerHTML = `
  <h2>Cómo se usa este panel</h2>
  <p>Cada número y título tiene un <span class="i" style="cursor:default">i</span>: pasá el mouse (o tocalo en el celular) para ver <b>de dónde sale</b> el dato (hoja y columna del Excel) y <b>cómo se calcula</b>. Los nombres de rubro subrayados con puntos también lo muestran.</p>
  <p>Muestra la plata que hay hoy, lo que entra y lo que sale en las próximas semanas, y en qué orden conviene pagar. Todo sale del Excel de Cash Flow (el mismo que usa Situación Patrimonial en "Importar Cash Flow").</p>
  <h3>Cargar los datos</h3>
  <ol>
    <li>Botón <b>Cargar Excel nuevo</b> → elegir el Cash Flow (.xlsx). Tiene que tener al menos las hojas <code>Planes ARCA</code> y <code>Créditos Bancarios</code>.</li>
    <li>Queda guardado en la base compartida: todos los que tienen el panel ven lo mismo, en cualquier PC. Arriba dice el archivo, la fecha y quién lo cargó.</li>
    <li>El chip <b>Base compartida</b> en verde confirma la conexión. Si aparece en amarillo, se está viendo la copia guardada dentro del archivo (puede estar vieja).</li>
    <li>Cargar Excel: administradores del portal (o usuarios con permiso "importar"). El resto solo ve.</li>
    <li>Al cargar un Excel, la hoja "Caja y Bancos" se suma a la solapa Caja y Bancos sin borrar días anteriores ni pisar lo cargado a mano.</li>
  </ol>
  <p class="muted">La <b>Fecha de análisis</b> sirve para mirar "como si fuera" otro día. No cambia lo guardado ni el recuadro de la portada, que siempre se calcula con la fecha de hoy.</p>

  <h3>Solapa Prioridades</h3>
  <div class="tbl"><table><thead><tr><th>Dato</th><th>Cómo se calcula</th></tr></thead><tbody>
    <tr><td><b>Disponible hoy</b></td><td>Efectivo + margen libre de los acuerdos + cheques de terceros en cartera, con el último saldo cargado en <code>Caja y Bancos</code> hasta la fecha de análisis. Margen de cada banco = acuerdo + saldo (si da negativo, cuenta 0 y la diferencia pasa a "Excedido de acuerdo"). Los dólares no se suman.</td></tr>
    <tr><td><b>Entra</b></td><td>Cobros pendientes con fecha prevista de pago entre hoy y 6 días después (hoja Clientes; los cheques de terceros ya están dentro del disponible). No incluye lo proyectado (OV sin facturar, Ventas futuras).</td></tr>
    <tr><td><b>Sale</b></td><td>Pagos pendientes con fecha prevista en esos 7 días, de todas las hojas de egresos. La barra muestra cuánto es de cada prioridad. No incluye OC sin facturar.</td></tr>
    <tr><td><b>Queda</b></td><td>Disponible hoy + Entra − Sale.</td></tr>
    <tr><td><b>Atrasado</b></td><td>Pagos pendientes con fecha anterior a hoy. Se muestra aparte para no mezclarlo con la semana.</td></tr>
    <tr><td><b>Caja, bancos y acuerdos</b></td><td>Primero Spotsline y después SPL. Fila por fila: bancos (saldo, acuerdo, disponible, a cubrir), efectivo y cheques en cartera, el total en pesos y, aparte, la moneda extranjera abierta cuenta por cuenta en US$. La fecha en naranja avisa que esa cuenta no se actualizó el último día.</td></tr>
  </tbody></table></div>

  <h3>Prioridades de pago</h3>
  <div class="tbl"><table><thead><tr><th>Nivel</th><th>Qué entra</th></tr></thead><tbody>
    <tr><td><span class="pill l0">Límite superado</span></td><td>Créditos con 2 o más cuotas vencidas impagas; planes ARCA con 3 o más.</td></tr>
    <tr><td><span class="pill l1">Crítica</span></td><td>Excedido de acuerdo, cheques propios, sueldos, cargas sociales. También créditos/planes a 7 días de la cuota que los lleva al límite.</td></tr>
    <tr><td><span class="pill l2">Alta</span></td><td>Créditos bancarios, planes ARCA, impuestos, deudas ARCA.</td></tr>
    <tr><td><span class="pill l3">Media</span></td><td>Tarjetas de crédito, servicios, planes de pago.</td></tr>
    <tr><td><span class="pill l4">Negociable</span></td><td>Proveedores, proveedores del exterior, OC sin facturar, desvinculaciones.</td></tr>
  </tbody></table></div>
  <p class="muted">Los planes marcados "NO pagar" o caducos no se cuentan. Los cheques propios se dan por pagados cuando pasa su fecha.</p>

  <h3>Solapa Presupuesto del día</h3>
  <p>Para armar los pagos de un día (o de varios): elegí <b>Hoy</b>, <b>Mañana</b>, <b>Hasta el viernes</b>, <b>Próximos 7 días</b> o las fechas que quieras.</p>
  <ul>
    <li>Arriba: <b>Tengo</b> (disponible + cobros esperados hasta esa fecha), <b>Atrasado</b>, lo que <b>Vence</b>, el <b>Mínimo</b> a pagar, lo que elegiste <b>A pagar</b> y cuánto <b>Falta o Sobra</b>.</li>
    <li>Abajo, por rubro con subtotales y plan por plan. En créditos y planes ARCA el mínimo es lo justo para no caer: si al 12/11 un plan ARCA tendría 4 cuotas impagas, el mínimo son las 2 más viejas (queda en 2, una menos que el límite de 3).</li>
    <li>Sueldos, cargas, cheques propios y excedidos de acuerdo van completos; impuestos y deudas ARCA, lo que vence; el resto queda en 0 para decidir.</li>
    <li>Cambiá el monto de "A pagar" en la fila que quieras y los totales se recalculan. <b>Guardar presupuesto</b> lo deja guardado para ese día y empresa.</li>
  </ul>
  <h3>Ordenar tablas</h3>
  <p>Tocá el título de cualquier columna para ordenar de menor a mayor; otra vez, de mayor a menor. En las tablas con grupos (empresa, rubro) se ordena dentro de cada grupo. La grilla del cash flow no se ordena porque va por fechas.</p>
  <h3>Solapa Cash flow</h3>
  <p>Grilla por día, semana, quincena o mes con ingresos, egresos y saldo acumulado arrancando del disponible. Hacé clic en un número para ver los movimientos que lo forman. Las columnas en rojo son lo atrasado.</p>
  <ul>
    <li><b>Saldo inicial</b> se abre (▸) en Efectivo, Bancos (margen de acuerdos), Cheques en cartera y Moneda extranjera, y cada uno en sus cuentas, igual que la tabla de Prioridades.</li>
    <li><b>Deudores por ventas</b> sale del <b>panel de Cobranzas</b>: cada factura × el % de cobro del objetivo del mes según su tipo de deudor (o el % del vendedor). Lo que todavía no venció va en su fecha; lo vencido se reparte parejo en las semanas que quedan del mes. Se abre por tipo de deudor.</li>
    <li><b>OV sin facturar</b> (etapa 2: Odoo) y <b>Ventas futuras</b> (etapa 2: Planificación de Ventas) ya figuran; por ahora toman las hojas del Excel y solo suman con la casilla de proyecciones.</li>
    <li><b>Proveedores</b> sale del <b>panel de Proveedores</b>: facturas impagas en su vencimiento (lo vencido va a Atrasado), descontando saldos a favor.</li>
    <li>Si Cobranzas o Proveedores no responden (o tu usuario no tiene ese panel), se usa la hoja del Excel y la fila lo avisa en amarillo.</li>
  </ul>
  <h3>Ver un plan completo</h3>
  <p>Los nombres subrayados con rayas (planes ARCA, créditos, proveedores, clientes…) se pueden tocar: abren todo ese plan o acreedor, con lo pagado, la deuda, lo vencido, la próxima cuota y cada cuota con su estado. Están en Prioridades, en el detalle de cada número del cash flow y en Detalle de deudas.</p>
  <h3>Solapa Caja y Bancos</h3>
  <p>Los saldos de cada cuenta, día por día, como en la hoja "Caja y Bancos" del Excel. Hoy se llenan solos al cargar el Excel; también se pueden cargar y corregir a mano.</p>
  <ol>
    <li>Elegí el día en <b>Día</b> o creá uno con <b>Nuevo día</b>. La columna amarilla es la que se edita; las de la izquierda son los días anteriores.</li>
    <li><b>Copiar día anterior</b> completa las celdas vacías con el último saldo de cada cuenta. Corregí lo que cambió.</li>
    <li>Los acuerdos de cada banco se corrigen en la última columna. <b>+ Cuenta</b> agrega una cuenta nueva.</li>
    <li><b>Guardar cambios</b>. Queda para todos y se recalcula el panel y el recuadro de la portada.</li>
  </ol>
  <p class="muted">Los días anteriores no se borran nunca. Lo cargado a mano queda marcado con una línea celeste y un Excel nuevo no lo pisa (actualiza solo lo que vino del Excel). Cada cambio queda en el <b>Registro de cambios</b> con quién, cuándo, valor anterior y nuevo. Cargar saldos: administradores o usuarios con permiso "editar" o "importar".</p>
  <h3>Solapa Detalle de deudas</h3>
  <p>Todos los movimientos con buscador y filtros por rubro, prioridad y estado.</p>
  <h3>Lo que no entra</h3>
  <p>Deudas sin fecha de vencimiento o sin empresa (por ejemplo Deuda OS): aparecen al final de Prioridades, en "Deudas que no se pueden ubicar en el calendario".</p>

  <h2>Recuadro en el Panel de Paneles</h2>
  <div class="tbl"><table><thead><tr><th>Número</th><th>Qué es</th></tr></thead><tbody>
    <tr><td>Disponible hoy</td><td>Igual que arriba, con la fecha de hoy.</td></tr>
    <tr><td>Pagos 7 días</td><td>"Sale" de la semana.</td></tr>
    <tr><td>Queda en 7 días</td><td>Disponible + cobros − pagos de la semana.</td></tr>
    <tr><td>Atrasado crítico</td><td>Pagos atrasados de prioridad Crítica o Límite superado.</td></tr>
  </tbody></table></div>
  <p class="muted">"Todas" en la portada = SPL + Spotsline (sin los socios). Se recalcula cada vez que alguien abre este panel en un día nuevo o carga un Excel.</p>
  <p class="muted">Pedidos de mejora: botón 💡 Mejoras abajo a la derecha (bandeja única del portal).</p>`;
}

/* ---------- Modal ---------- */
function showItems(title, items, planes){
  const its = items.slice().sort((a,b)=>(a.fp<b.fp?-1:a.fp>b.fp?1:0));
  const tot = its.reduce((s,i)=>s+(i.tipo==='ingreso'?i.monto:i.monto),0);
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = `<div class="totline"><b>${its.length}</b> movimientos, total <b>${money(tot)}</b></div>
  <div class="tw"><table><thead><tr><th>Empresa</th><th>Rubro${ii('rubro')}</th><th>Detalle${ii('detalle')}</th><th>Vence${ii('vence')}</th><th>Pago previsto${ii('pagoPrev')}</th><th class="n">Monto${ii('monto')}</th><th>Estado${ii('estado')}</th></tr></thead><tbody>
  ${its.map(it=>{ const nv = it.tipo==='egreso'? nivelDe(it,planes):null; return `<tr><td>${esc(it.emp)}${it.socio?' ('+esc(it.socio)+')':''}</td><td>${txtCat(it.cat)}</td><td class="wrapc">${it.sintetico?esc(it.det):lnk(it.cat,it.emp,it.grupo,esc(it.det))}${it.nota?'<br><span class="hint">'+esc(it.nota)+'</span>':''}</td><td class="${isPend(it)&&it.vto<st.hoy?'neg':''}">${fdate(it.vto)}</td><td>${fdate(it.fp)}</td><td class="n">${money(it.monto)}</td><td>${isPaid(it)?'Pagado':(nv!==null?`<span class="pill l${nv}">${NIVELES[nv].nombre}</span>`:'Pendiente')}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  document.getElementById('modal').showModal();
}
document.getElementById('mClose').onclick=()=>document.getElementById('modal').close();
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.target.close(); });

initData();
