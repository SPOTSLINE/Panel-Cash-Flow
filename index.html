<!DOCTYPE html>
<html lang="es">
<head>
<script src="/Paneldepaneles/candado.js" data-panel="cashflow"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Flow · SPL y Spotsline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  /* Misma paleta que el Estado de Resultados (negro + amarillo corporativo) */
  --bg:#0e0e0e; --surface:#181818; --surface-2:#202020; --ink:#f1f1f1; --muted:#9b9b9b; --line:#2b2b2b;
  --brand:#f5c400; --brand-soft:#2a230a;
  --yellow:#f5c400; --yellow-ink:#121212; --yellow-soft:#2a230a;
  --sync:#10301d; --sync-ink:#7fdca5; --pend-bg:#2a2410; --celeste-ink:#8fd0f0;
  --p0:#ff5c7a; --p1:#ff6b5e; --p2:#f0a84f; --p3:#d9c46a; --p4:#4ade80;
  --p0-bg:#3a1520; --p1-bg:#3a1513; --p2-bg:#3b2a15; --p3-bg:#2e2a14; --p4-bg:#0f2e1b;
  --neg:#ff6b5e; --pos:#4ade80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:hover{filter:brightness(.97)}
.dateinp{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px;font-size:14px}
label.inline{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}

.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:4px 0 18px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

/* Semana: la pieza central */
.week{display:grid;gap:14px;margin-bottom:28px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.wk h3{margin:0;font-size:20px;font-weight:800}
.wk .who small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.eq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.eq .term{padding:6px 0 0;border-top:3px solid var(--line)}
.eq .term.res{border-top-color:var(--ink)}
.eq .lbl{font-size:12px;color:var(--muted);font-weight:600}
.eq .val{font-size:20px;font-weight:800;letter-spacing:-.01em}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:6px;background:var(--surface-2)}
.stack span{display:block;height:100%}
.late{grid-column:2;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px}
.late b{color:var(--ink)}
.neg{color:var(--neg)} .pos{color:var(--pos)}

h2{font-size:19px;margin:30px 0 4px;font-weight:800;letter-spacing:-.01em}
.h2sub{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:760px}

/* Alertas */
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.al{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px 14px}
.al.l0{border-left-color:var(--p0)} .al.l1{border-left-color:var(--p1)} .al.soon{border-left-color:var(--p2)}
.al .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.al .name{font-weight:700}
.al .emp{font-size:12px;color:var(--muted)}
.al .state{font-size:12px;font-weight:700;margin:4px 0 6px}
.al.l0 .state{color:var(--p0)} .al.l1 .state{color:var(--p1)} .al.soon .state{color:var(--p2)}
.al dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.al dt{color:var(--muted)} .al dd{margin:0;text-align:right;font-weight:600}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:14px}

/* Tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);position:sticky;top:0}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
td.wrapc{white-space:normal;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.l0{background:var(--p0-bg);color:var(--p0)} .pill.l1{background:var(--p1-bg);color:var(--p1)}
.pill.l2{background:var(--p2-bg);color:var(--p2)} .pill.l3{background:var(--p3-bg);color:var(--p3)} .pill.l4{background:var(--p4-bg);color:var(--p4)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d0{background:var(--p0)} .d1{background:var(--p1)} .d2{background:var(--p2)} .d3{background:var(--p3)} .d4{background:var(--p4)}

/* Grilla cash flow */
.cf th.first,.cf td.first{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px}
.cf th.first{background:var(--surface-2);z-index:2}
.cf td{font-size:13px}
.cf td.c{text-align:right;cursor:pointer}
.cf td.c:hover{background:var(--brand-soft)}
.cf td.z{color:var(--line)}
.cf tr.sec td{font-weight:800;background:var(--surface-2)}
.cf tr.sec td.first{background:var(--surface-2)}
.cf tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.cf tr.saldo td{font-weight:800}
.cf tr.saldo td.c.neg{background:var(--p1-bg)}
.cf tr.sub td.first{padding-left:24px;display:flex;gap:8px;align-items:center}
.cf tr.sub2 td.first{padding-left:42px;color:var(--muted)}
.cf th.lateh,.cf td.late{background:var(--p1-bg)}
.cf .tog{border:0;background:transparent;padding:0 6px 0 0;font-weight:800;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:8px 2px}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:8px;font-size:14px}
.filters input{min-width:220px;flex:1}
.totline{font-size:13px;color:var(--muted);margin:6px 2px 10px}
.totline b{color:var(--ink)}
.more{margin-top:10px}

details.avisos{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.avisos summary{font-weight:700;cursor:pointer}

/* Modal */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:min(920px,94vw);width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px}
.mh h3{margin:0;font-size:17px}
.mb{padding:12px 18px 18px;max-height:70vh;overflow:auto}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:50}
.hidden{display:none}

/* ===== Look corporativo amarillo y negro (igual al Estado de Resultados) ===== */
header.top{padding:14px 18px;margin:-20px -20px 18px;background:#141414;border-bottom:1px solid var(--line);align-items:center}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:34px;height:34px;border-radius:8px;background:var(--yellow);flex:none}
.brand h1{font-size:clamp(18px,2vw,22px);letter-spacing:-.01em;font-weight:800;margin:0;line-height:1.1}
.h1sub{font-weight:600;color:var(--muted)}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.btn{background:var(--surface);color:var(--ink);border-color:#3a3a3a;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:none;border-color:var(--yellow)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.dateinp,.filters input,.filters select{background:var(--surface);border-color:#3a3a3a;color-scheme:dark}
:focus-visible{outline-color:var(--celeste-ink)}
.conn{font-size:12px;padding:2px 9px;border-radius:99px;background:#232323;color:var(--muted);white-space:nowrap}
.conn.ok{background:var(--sync);color:var(--sync-ink)}
.conn.bad{background:var(--pend-bg);color:var(--ink)}
.seg{border-color:#3a3a3a;border-radius:8px}
.seg button{border-radius:6px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}
.tabs{border-bottom:1px solid var(--line);gap:4px}
.tabs button{font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--yellow);border-bottom-color:var(--yellow)}
h2{font-size:17px}
.wk{border-color:var(--line);box-shadow:inset 4px 0 0 var(--yellow)}
.wk h3{font-size:18px}
.eq .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.eq .term.res{border-top-color:var(--yellow)}
.eq .term.res .val.pos{color:var(--yellow)}
.late{background:#141414;border:1px solid var(--line)}
.tw{border-color:#333}
th{background:#141414;border-bottom:2px solid var(--yellow)}
tbody tr:hover td{background:#202020}
.al{background:var(--surface);border-color:var(--line)}
.empty{border-color:#3a3a3a}
.cf th.first{background:#141414}
.cf td.z{color:#3a3a3a}
.cf td.c:hover{background:var(--yellow-soft);color:var(--yellow)}
.cf tr.sec td,.cf tr.sec td.first{background:#262626;color:#fff;font-weight:700}
.cf tr.sec td.first{box-shadow:inset 4px 0 0 var(--yellow)}
.cf tr.sub td{background:#151515;color:#cfcfcf}
.cf tr.sub td.first{background:#151515;box-shadow:inset 4px 0 0 #3a3a3a}
.cf tr.sub2 td,.cf tr.sub2 td.first{background:#131313}
.cf tr.tot td,.cf tr.tot td.first{background:var(--yellow-soft);color:var(--yellow);border-top:2px solid var(--yellow);font-weight:800}
.cf tr.saldo td,.cf tr.saldo td.first{background:#1d1d1d}
.cf tr.saldo td.c.neg{background:var(--p1-bg);color:var(--neg)}
.cf th.lateh,.cf td.late{background:#2a1513}
details.avisos{border-color:var(--line)}
details.avisos summary{color:var(--yellow)}
dialog{border-color:#3a3a3a}
dialog::backdrop{background:rgba(0,0,0,.6)}
.mh{background:#141414;border-bottom:2px solid var(--yellow)}
.toast{background:var(--yellow);color:var(--yellow-ink);font-weight:600}
[hidden]{display:none!important}
/* ===== ⓘ información de cada dato ===== */
.i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid #5a5a5a;color:var(--muted);font:700 10px/1 "Public Sans",system-ui,sans-serif;font-style:normal;cursor:help;margin-left:6px;vertical-align:middle;flex:none;text-transform:none;letter-spacing:0;user-select:none}
.i:hover,.i:focus-visible,.i.on{border-color:var(--yellow);color:var(--yellow);outline:none}
.infotxt{border-bottom:1px dotted #6a6a6a;cursor:help}
.infotxt:hover{border-bottom-color:var(--yellow)}
#tip{position:fixed;z-index:80;max-width:min(360px,calc(100vw - 24px));background:#141414;border:1px solid var(--yellow);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.55);display:none;pointer-events:none;text-transform:none;letter-spacing:0;font-weight:400}
#tip .tt{font-weight:800;color:var(--yellow);margin-bottom:4px}
#tip .ts{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
/* ===== Caja, bancos y acuerdos (Prioridades) ===== */
table.cb tr.emp td{background:#262626;color:#fff;font-weight:800;box-shadow:inset 4px 0 0 var(--yellow)}
table.cb tr.grp td{background:#141414;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:9px}
table.cb tr.tot td{background:var(--yellow-soft);color:var(--yellow);font-weight:800;border-top:2px solid var(--yellow)}
table.cb tr.usd td{color:#cfe6d7}
table.cb tr.usdt td{background:#132019;color:var(--pos);font-weight:800}
table.cb td.c1{padding-left:24px}
table.cb td.viejo{color:var(--p2);font-weight:700}
/* ===== Caja y Bancos editable ===== */
.cjbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}
.cjbar select,.cjbar input[type=date],.cjform input,.cjform select{border:1px solid #3a3a3a;background:var(--surface);padding:7px 10px;border-radius:8px;font-size:14px;color-scheme:dark}
.cjbar .sp{flex:1}
.pendn{font-size:12.5px;color:var(--yellow);font-weight:700}
table.cj td,table.cj th{padding:5px 8px}
table.cj th.dsel{background:var(--yellow-soft);color:var(--yellow)}
table.cj td.old{color:#8d8d8d;font-size:12.5px}
table.cj td.sel{background:#1c1a10;padding:3px 6px}
table.cj input.v{width:132px;text-align:right;background:var(--bg);border:1px solid #3a3a3a;border-radius:6px;padding:5px 7px;font-variant-numeric:tabular-nums;font-size:13.5px}
table.cj input.v:focus{border-color:var(--yellow);outline:none}
table.cj input.v.chg{border-color:var(--yellow);background:#2a230a;color:var(--yellow)}
table.cj input.v.man{box-shadow:inset 3px 0 0 var(--celeste-ink)}
table.cj input.v:disabled{opacity:.75}
table.cj tr.emp td{background:#262626;color:#fff;font-weight:800;box-shadow:inset 4px 0 0 var(--yellow)}
table.cj tr.grp td{background:#141414;color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
table.cj tr.st td{background:#1d1d1d;font-weight:700}
table.cj tr.st.usd td{color:var(--pos)}
table.cj td.var.neg{color:var(--neg)} table.cj td.var.pos{color:var(--pos)}
.cjform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.leyc{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:8px 2px}
.leyc span{display:inline-flex;gap:6px;align-items:center}
.sw2{width:14px;height:14px;border-radius:3px;border:1px solid #3a3a3a;display:inline-block}
details.reg{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.reg summary{font-weight:700;cursor:pointer;color:var(--yellow)}
a.lnk{color:inherit;text-decoration:none;border-bottom:1px dashed #6a6a6a;cursor:pointer}
a.lnk:hover,a.lnk:focus-visible{color:var(--yellow);border-bottom-color:var(--yellow)}
.cf tr.sub3 td,.cf tr.sub3 td.first{background:#111;color:#a9a9a9;font-size:12.5px}
.cf tr.sub3 td.first{padding-left:60px}
.cf td.ini{color:var(--ink)}
.tag2{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:99px;background:#232323;color:var(--muted);margin-left:8px;vertical-align:middle}
.tag2.ok{background:var(--sync);color:var(--sync-ink)}
.tag2.warn{background:var(--pend-bg);color:var(--yellow)}
.plres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.plres div{background:#141414;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.plres small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.plres b{font-size:17px}
tr.pag td{color:#7d7d7d}
.fuentes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
/* ordenar columnas */
table:not(.cf):not(.nosort) thead th{cursor:pointer;user-select:none}
table:not(.cf):not(.nosort) thead th:hover{color:var(--ink)}
th[data-ord]::after{content:" ▲";color:var(--yellow);font-size:10px}
th[data-ord="desc"]::after{content:" ▼"}
/* Presupuesto del día */
.prbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px}
.prbar input[type=date]{border:1px solid #3a3a3a;background:var(--surface);padding:7px 10px;border-radius:8px;font-size:14px;color-scheme:dark}
.prk{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0 0 16px}
.prk .k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.prk .k .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prk .k .v{font-size:clamp(18px,1.9vw,24px);font-weight:800;line-height:1.15;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prk .k .s{font-size:12px;color:var(--muted);margin-top:4px}
.prk .k.hero{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.prk .k.hero .t,.prk .k.hero .s{color:#3b3200}
.prk .k.mal{background:#3a1513;border-color:var(--neg)}
.prk .k.mal .v{color:var(--neg)}
.prk .k.bien .v{color:var(--pos)}
table.pr tr.rub td{background:#262626;color:#fff;font-weight:800;cursor:pointer}
table.pr tr.rub td:first-child{box-shadow:inset 4px 0 0 var(--yellow)}
table.pr tr.tot td{background:var(--yellow-soft);color:var(--yellow);font-weight:800;border-top:2px solid var(--yellow)}
table.pr tr.pr td:first-child{padding-left:26px}
table.pr input.ap{width:130px;text-align:right;background:var(--bg);border:1px solid #3a3a3a;border-radius:6px;padding:4px 7px;font-variant-numeric:tabular-nums;font-size:13px}
table.pr input.ap:focus{border-color:var(--yellow);outline:none}
table.pr input.ap.chg{border-color:var(--yellow);color:var(--yellow)}
table.pr td.regla{white-space:normal;min-width:230px;font-size:12.5px;color:#bdbdbd}
.cuo{font-weight:700}.cuo.lim{color:var(--neg)}.cuo.casi{color:var(--p2)}

.seg{flex-wrap:wrap;max-width:100%}
input[type=checkbox]{accent-color:var(--yellow)}
/* Ayuda */
.ayuda{max-width:900px;line-height:1.6}
.ayuda h2{font-size:21px;font-weight:800;margin:28px 0 8px}
.ayuda h2:first-child{margin-top:4px}
.ayuda h3{font-size:15.5px;margin:20px 0 6px;color:var(--yellow)}
.ayuda p,.ayuda li{color:var(--ink)}
.ayuda li{margin:4px 0}
.ayuda .muted{color:var(--muted)}
.ayuda code{background:#232323;padding:1px 6px;border-radius:4px;font-size:12.5px}
.ayuda .tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:8px 0}
.ayuda table{font-size:13px}
.ayuda td,.ayuda th{white-space:normal;vertical-align:top}

<script>
// Convierte el Excel de Cash Flow en una lista normalizada de movimientos.
// Mismas columnas que usan las fórmulas de las hojas "CF Spotsline" / "CF SPL".
function extractCash(XLSX, wb) {
  const pad = n => String(n).padStart(2, '0');
  function toISO(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') {
      if (v < 20000 || v > 80000) return null;
      const d = new Date(Math.round((v - 25569) * 86400000));
      return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    }
    if (v instanceof Date) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(m[2]) + '-' + pad(m[1]); }
    return null;
  }
  function num(v) {
    if (v === null || v === undefined || v === '' || v === '-') return 0;
    if (typeof v === 'number') return v;
    let s = String(v).trim().replace(/\$/g, '').replace(/\s/g, '');
    if (/^-?[\d.]+,\d+$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(s.replace(/,/g, ''));
    return isNaN(n) ? 0 : n;
  }
  const txt = v => (v === null || v === undefined) ? '' : String(v).trim();
  const si = v => txt(v).toUpperCase() === 'SI';
  // Socios: se identifican por nombre o apodo en la columna Empresa o en el texto del registro
  function socioDe(t) {
    const u = ' ' + txt(t).toUpperCase().replace(/[.,]/g, ' ') + ' ';
    if (/EDUARDO|\bLALO\b/.test(u)) return 'Eduardo Porcel';
    if (/FACUNDO|\bFACU\b/.test(u)) return 'Facundo Porcel';
    if (/JUAN MANUEL|\bJM\b|\sJ\s/.test(u)) return 'Juan Manuel Porcel';
    return null;
  }
  function empresa(v, pista) {
    const u = txt(v).toUpperCase();
    if (!u) return null;
    if (u === 'SPL') return { emp: 'SPL', socio: '' };
    if (u === 'SPOTSLINE') return { emp: 'Spotsline', socio: '' };
    if (u === 'EMPRESA' || u === 'TOTAL') return null;
    const s = socioDe(u) || socioDe(pista);
    return { emp: s || 'Socios sin identificar', socio: s ? '' : u };
  }
  // Lee siempre desde A1 (algunas hojas tienen el rango arrancando en A2)
  function grid(ws) {
    if (!ws || !ws['!ref']) return [];
    const rg = XLSX.utils.decode_range(ws['!ref']); rg.s.r = 0; rg.s.c = 0;
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, range: rg });
  }
  function rows(name) { return grid(wb.Sheets[name]).slice(1); }
  const items = [];
  const avisos = [];
  function push(o) {
    if (!o.emp) return;
    if (!o.monto) return;
    items.push(o);
  }
  function E(r) { return empresa(r[0]); }

  // ---------- EGRESOS ----------
  // Créditos bancarios: K cuota, B vto, C fecha pago, M cancelado
  rows('Créditos Bancarios').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[1]); if (!vto) return;
    const banco = txt(r[4]), cod = txt(r[5]);
    push({ ...e, tipo: 'egreso', cat: 'Créditos bancarios', grupo: banco + ' ' + cod,
      det: banco + ' ' + cod + (r[11] ? ' · cuota ' + txt(r[11]) : ''), vto, fp: toISO(r[2]) || vto,
      monto: num(r[10]), pagado: si(r[12]), estado: txt(r[13]), nota: '' });
  });
  // Planes ARCA: J total, K vto, L fecha pago, M cancelado, N estado, O nota
  rows('Planes ARCA').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[10]); if (!vto) return;
    const plan = txt(r[2]);
    push({ ...e, tipo: 'egreso', cat: 'Planes ARCA', grupo: 'Plan ' + plan,
      det: 'Plan ' + plan + ' · cuota ' + txt(r[5]), vto, fp: toISO(r[11]) || vto,
      monto: num(r[9]), pagado: si(r[12]), estado: txt(r[13]), nota: txt(r[14]) });
  });
  // Planes de pago: I cuota, B vto, C fecha pago, K cancelado
  rows('Planes de Pago').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[1]); if (!vto) return;
    const plan = (txt(r[3]) + ' ' + txt(r[4])).trim();
    push({ ...e, tipo: 'egreso', cat: 'Planes de pago', grupo: plan,
      det: plan + (r[9] !== null ? ' · cuota ' + txt(r[9]) : ''), vto, fp: toISO(r[2]) || vto,
      monto: num(r[8]), pagado: si(r[10]), estado: txt(r[11]), nota: '' });
  });
  // Desvinculaciones: I cuota, B vto, C fecha pago, K cancelado
  rows('Desvinculaciones').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[1]); if (!vto) return;
    push({ ...e, tipo: 'egreso', cat: 'Desvinculaciones', grupo: txt(r[4]),
      det: txt(r[4]) + ' · cuota ' + txt(r[9]), vto, fp: toISO(r[2]) || vto,
      monto: num(r[8]), pagado: si(r[10]), estado: txt(r[11]), nota: '' });
  });
  // Impuestos: D importe, E vto, F fecha pago, G cancelado
  rows('Impuestos').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[4]) || toISO(r[5]); if (!vto) return;
    push({ ...e, tipo: 'egreso', cat: 'Impuestos', grupo: txt(r[1]),
      det: txt(r[1]) + ' ' + txt(r[2]), vto, fp: toISO(r[5]) || vto,
      monto: num(r[3]), pagado: si(r[6]), estado: '', nota: '' });
  });
  // Deudas ARCA: K total, G vto, L fecha pago, N cancelado
  rows('Deudas ARCA').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[6]) || toISO(r[11]);
    const det = txt(r[1]) + ' · ' + txt(r[2]) + ' ' + txt(r[4]);
    if (!vto) { if (num(r[10])) avisos.push({ ...e, cat: 'Deudas ARCA', det, monto: num(r[10]), motivo: 'sin fecha de vencimiento' }); return; }
    push({ ...e, tipo: 'egreso', cat: 'Deudas ARCA', grupo: txt(r[1]), det, vto, fp: toISO(r[11]) || vto,
      monto: num(r[10]), pagado: si(r[13]), estado: '', nota: '' });
  });
  // Tarjetas: C importe, D vto, E fecha pago, G cancelado
  rows('TDC').forEach(r => {
    const e = empresa(r[0], r[1]); if (!e) return;
    const vto = toISO(r[3]); if (!vto) return;
    push({ ...e, tipo: 'egreso', cat: 'Tarjetas de crédito', grupo: txt(r[1]),
      det: txt(r[1]), vto, fp: toISO(r[4]) || vto, monto: num(r[2]), pagado: si(r[6]), estado: '', nota: '' });
  });
  // Servicios: F importe, G vto, H fecha pago, J cancelado, K nota
  rows('Servicios').forEach(r => {
    const e = empresa(r[0], r[2]); if (!e) return;
    const vto = toISO(r[6]) || toISO(r[7]); if (!vto) return;
    push({ ...e, tipo: 'egreso', cat: 'Servicios', grupo: txt(r[2]),
      det: txt(r[2]) + ' · ' + txt(r[1]), vto, fp: toISO(r[7]) || vto,
      monto: num(r[5]), pagado: si(r[9]), estado: '', nota: txt(r[10]) });
  });
  // Sueldos y cargas: B concepto, D vto, E fecha posible, F referencia, G importe, H estado en pago
  rows('Sueldos y CCSS').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[3]) || toISO(r[4]); if (!vto) return;
    const concepto = txt(r[1]) || 'Sueldos';
    push({ ...e, tipo: 'egreso', cat: /carga/i.test(concepto) ? 'Cargas sociales' : 'Sueldos', grupo: txt(r[5]),
      det: txt(r[5]) + (r[2] ? ' · ' + (toISO(r[2]) || '').slice(0, 7) : ''), vto, fp: toISO(r[4]) || vto,
      monto: num(r[6]), pagado: si(r[7]), estado: '', nota: txt(r[9]) });
  });
  // Cheques propios: D fecha de pago, H importe. Se debitan solos: pagado si la fecha ya pasó (se decide en el panel).
  rows('Ch Propios').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[3]); if (!fp) return;
    push({ ...e, tipo: 'egreso', cat: 'Cheques propios', grupo: txt(r[6]),
      det: 'Ch. ' + txt(r[4]) + ' · ' + txt(r[6]), vto: fp, fp, monto: num(r[7]), pagado: null, auto: true, estado: '', nota: txt(r[10]) });
  });
  // Proveedores: K importe residual (negativo = deuda), D vto, M fecha pago
  rows('Proveedores').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[12]) || toISO(r[3]); if (!fp) return;
    push({ ...e, tipo: 'egreso', cat: 'Proveedores', grupo: txt(r[7]),
      det: txt(r[7]) + ' · ' + txt(r[6]), vto: toISO(r[3]) || fp, fp, monto: -num(r[10]), pagado: false, estado: '', nota: '' });
  });
  // OC sin facturar: J total, O fecha pago
  rows('OC sin FC').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[14]); if (!fp) return;
    push({ ...e, tipo: 'egreso', cat: 'OC sin facturar', grupo: txt(r[4]), proyectado: true,
      det: txt(r[2]) + ' · ' + txt(r[4]), vto: fp, fp, monto: num(r[9]), pagado: false, estado: '', nota: '' });
  });
  // COMEX: filas con vencimiento (H) y saldo AR$ (N) = pendiente; filas con pago (I) y pago a cuenta AR$ (M) = pagado
  rows('COMEX').forEach(r => {
    const e = E(r); if (!e) return;
    const vto = toISO(r[7]), fpag = toISO(r[8]);
    const base = txt(r[3]) + ' · ' + txt(r[1]);
    if (vto && num(r[13]) > 0) push({ ...e, tipo: 'egreso', cat: 'Proveedores del exterior', grupo: txt(r[3]),
      det: base + ' (USD ' + Math.round(num(r[10])).toLocaleString('es-AR') + ')', vto, fp: vto, monto: num(r[13]), pagado: false, estado: '', nota: '' });
    if (!vto && fpag && num(r[12]) < 0) push({ ...e, tipo: 'egreso', cat: 'Proveedores del exterior', grupo: txt(r[3]),
      det: base + ' (pago a cuenta)', vto: fpag, fp: fpag, monto: -num(r[12]), pagado: true, estado: '', nota: '' });
  });

  // ---------- INGRESOS ----------
  rows('Clientes').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[12]) || toISO(r[3]); if (!fp) return;
    push({ ...e, tipo: 'ingreso', cat: 'Deudores por ventas', grupo: txt(r[7]),
      det: txt(r[7]) + ' · ' + txt(r[6]), vto: toISO(r[3]) || fp, fp, monto: num(r[10]), pagado: false, estado: '', nota: '' });
  });
  rows('Cheques 3º').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[3]); if (!fp) return;
    push({ ...e, tipo: 'ingreso', cat: 'Cheques de terceros', grupo: txt(r[6]),
      det: 'Ch. ' + txt(r[4]) + ' · ' + txt(r[6]), vto: fp, fp, monto: num(r[8]), pagado: false, estado: '', nota: '' });
  });
  rows('OV sin FC').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[15]); if (!fp) return;
    push({ ...e, tipo: 'ingreso', cat: 'OV sin facturar', grupo: txt(r[4]), proyectado: true,
      det: txt(r[1]) + ' · ' + txt(r[4]), vto: fp, fp, monto: num(r[13]), pagado: false, estado: '', nota: '' });
  });
  rows('Ventas futuras').forEach(r => {
    const e = E(r); if (!e) return;
    const fp = toISO(r[3]); if (!fp) return;
    push({ ...e, tipo: 'ingreso', cat: 'Ventas futuras', grupo: 'Ventas futuras', proyectado: true,
      det: 'Venta estimada semana ' + (toISO(r[2]) || ''), vto: fp, fp, monto: num(r[7]), pagado: false, estado: '', nota: '' });
  });

  // ---------- DEUDA OBRAS SOCIALES (sin fecha) ----------
  rows('Deuda OS').forEach(r => {
    const n = txt(r[0]).toUpperCase();
    if (!n || n === 'TOTAL' || n === 'EMPRESA' || n === 'SPOTSLINE' || n === 'SPL') return;
    const m = num(r[1]); if (!m) return;
    avisos.push({ emp: 'Sin asignar', socio: '', cat: 'Obras sociales', det: txt(r[0]), monto: m, motivo: 'sin fecha ni empresa' });
  });

  // ---------- DISPONIBILIDADES (Caja y Bancos), cuenta por cuenta ----------
  const cuentas = [];
  const cb = wb.Sheets['Caja y Bancos'];
  if (cb) {
    const all = grid(cb);
    const hdr = all[2] || [];
    const fechas = hdr.map(toISO);
    const tipos = ['SALDO INICIAL', 'EFECTIVO', 'BANCOS', 'MONEDA EXTRANJERA', 'OTROS I', 'CHEQUES DE TERCEROS'];
    all.slice(3).forEach(r => {
      const e = empresa(r[0]); if (!e) return;
      const tipo = txt(r[1]).toUpperCase();
      if (!tipos.includes(tipo)) return;
      const serie = {};
      for (let c = 3; c < r.length; c++) {
        const f = fechas[c]; if (!f) continue;
        if (r[c] === null || r[c] === '') continue;
        serie[f] = num(r[c]);
      }
      cuentas.push({ emp: e.emp, tipo, cuenta: txt(r[2]), serie });
    });
  }
  // ---------- ACUERDOS EN DESCUBIERTO (hoja cuyo nombre contenga "acuerdo") ----------
  const acuerdos = [];
  const hojaAc = wb.SheetNames.find(n => /acuerdo/i.test(n));
  if (hojaAc) {
    const g = grid(wb.Sheets[hojaAc]);
    const hi = g.findIndex(r => r && r.some(v => /empresa/i.test(txt(v))));
    const h = (g[hi] || []).map(v => txt(v).toUpperCase());
    const ci = re => h.findIndex(x => re.test(x));
    const cE = ci(/EMPRESA/), cC = ci(/CONCEPTO|CUENTA/), cM = ci(/ACUERDO|MONTO/), cV = ci(/VENC/);
    g.slice(hi + 1).forEach(r => {
      if (!r) return;
      const e = empresa(r[cE]); if (!e) return;
      const cuenta = txt(r[cC]); if (!cuenta) return;
      acuerdos.push({ emp: e.emp, cuenta, monto: Math.abs(num(r[cM])), vto: cV >= 0 ? toISO(r[cV]) : null });
    });
  }
  return { items, avisos, cuentas, acuerdos, hojaAcuerdos: hojaAc || null };
}

/* ====================== utilidades ====================== */
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function D(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function I(dt){ return dt.toISOString().slice(0,10); }
function addDays(iso,n){ const d=D(iso); d.setUTCDate(d.getUTCDate()+n); return I(d); }
function diffDays(a,b){ return Math.round((D(a)-D(b))/86400000); }
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function fdate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y.slice(2); }
const nf0 = new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
function money(v){ return (v<0?'-':'')+'$ '+nf0.format(Math.abs(Math.round(v))); }
function mill(v){ if(Math.abs(v)<5000) return '–'; return nf1.format(v/1e6); }
function millS(v){ return (v<0?'-':'')+'$ '+nf1.format(Math.abs(v)/1e6)+' M'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function fromCompact(c){
  const items = c.rows.map(r=>{ const o={}; c.keys.forEach((k,i)=>{ if(r[i]!==null) o[k]=r[i]; }); return o; });
  return {meta:c.meta, avisos:c.avisos||[], cuentas:c.cuentas||[], acuerdos:c.acuerdos||[], items};
}
function toCompact(d){
  const keys=['emp','socio','tipo','cat','grupo','det','vto','fp','monto','pagado','auto','proyectado','estado','nota'];
  return {meta:d.meta, avisos:d.avisos, cuentas:d.cuentas, acuerdos:d.acuerdos, keys, rows:d.items.map(i=>keys.map(k=>i[k]===undefined?null:i[k]))};
}

const SUPABASE_URL = 'https://ozbynorwhkmevjmftpmy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sBhFezk4bg0OPbSGG59jwA_bt1I1kpp';
const SUPABASE_TABLE = 'cashflow', ROW_DATOS = 'datos_v1', ROW_RESUMEN = 'resumen_v1';
let CONECTADO = false;
function sbHeaders(extra){ return Object.assign({apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json'}, extra||{}); }
async function sbLeer(id){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${id}&select=valor`, {headers:sbHeaders()});
  if(!r.ok) throw new Error('HTTP '+r.status);

}
async function sbGuardar(id, valor){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=id`, {method:'POST',
    headers:sbHeaders({Prefer:'resolution=merge-duplicates,return=minimal'}),
    body:JSON.stringify({id, valor, updated_at:new Date().toISOString()})});
  if(!r.ok){ const t = await r.text().catch(()=>''); throw new Error('HTTP '+r.status+' '+t.slice(0,160)); }
}

}

/* Resumen para la portada: siempre calculado con la fecha de hoy (no con la fecha de análisis elegida).
   "todas" = SPL + Spotsline (los socios quedan afuera del recuadro, igual que en el resto de los paneles). */
function calcSemana(emp, planes, hoy){
  const fin7 = addDays(hoy, 6);
  const d = dispHoy(emp);
  const its = ITEMS.filter(it=>it.emp===emp && !it.proyectado);
  const ing = its.filter(it=>it.tipo==='ingreso' && isPend(it) && it.fp>=hoy && it.fp<=fin7).reduce((s,i)=>s+i.monto,0);
  let egr=0, late=0, lateCrit=0;
  its.forEach(it=>{
    if(it.tipo!=='egreso' || !isPend(it) || planMuerto(it)) return;
    const n = nivelDe(it, planes);
    if(it.fp>=hoy && it.fp<=fin7) egr+=it.monto;
    else if(it.fp<hoy){ late+=it.monto; if(n<=1) lateCrit+=it.monto; }
  });
  const disp = d ? d.monto : 0;
  return {disp, fechaCaja: d ? d.fecha : null, ing, egr, queda: disp+ing-egr, late, lateCrit};
}
function calcResumen(){
  const hoyReal = isoLocal(new Date()), guardada = st.hoy;
  st.hoy = hoyReal; ITEMS = construirItems();
  try{
    const planes = evaluarPlanes();
    const sum = (a,b)=>{ const o={}; Object.keys(a).forEach(k=>{ o[k] = typeof a[k]==='number' ? a[k]+b[k] : ([a[k],b[k]].filter(Boolean).sort()[0]||null); }); return o; };
    const spl = calcSemana('SPL', planes, hoyReal), spotsline = calcSemana('Spotsline', planes, hoyReal);
    const riesgo = e => Object.values(planes).filter(p=>(!e||p.emp===e) && (p.estado==='superado'||p.estado==='critica')).length;
    spl.planesRiesgo = riesgo('SPL'); spotsline.planesRiesgo = riesgo('Spotsline');
    const todas = sum(spl, spotsline);
    return {hoy:hoyReal, archivo:(DATA.meta||{}).archivo||'', cargado:(DATA.meta||{}).cargado||'', generado:new Date().toISOString(), spl, spotsline, todas};
  } finally {
    st.hoy = guardada; ITEMS = construirItems();
  }
}
async function actualizarResumen(forzar){
  try{
    if(!forzar){
      const r = await sbLeer(ROW_RESUMEN).catch(()=>null);
      if(r && r.hoy===isoLocal(new Date()) && r.cargado===((DATA.meta||{}).cargado||'') && r.archivo===((DATA.meta||{}).archivo||'')) return;
    }
    await sbGuardar(ROW_RESUMEN, calcResumen());
  }catch(e){ console.warn('cashflow: no se pudo actualizar el resumen de la portada', e); }
}

/* ====================== motor ====================== */
function empOk(it){ return empsSel().includes(it.emp) || (st.emp==='Todas'); }
function isPend(it){ return it.auto ? it.fp >= st.hoy : it.pagado===false; }
function isPaid(it){ return it.auto ? it.fp < st.hoy : it.pagado===true; }
function planMuerto(it){ return /caduc|cancelad/i.test(it.estado||'') || /no pagar/i.test(it.nota||''); }

// Evalúa planes ARCA y créditos: cuotas vencidas impagas, próxima cuota y estado.
function evaluarPlanes(){
  const grupos = {};
  ITEMS.forEach(it=>{
    if(!REGLAS[it.cat] || it.tipo!=='egreso') return;
    const k = it.cat+'|'+it.emp+'|'+it.grupo;
    (grupos[k] = grupos[k] || {cat:it.cat, emp:it.emp, socio:it.socio, grupo:it.grupo, items:[]}).items.push(it);
  });
  const out = {};
  Object.entries(grupos).forEach(([k,g])=>{
    if(g.items.every(planMuerto)) return;
    const r = REGLAS[g.cat];
    const pend = g.items.filter(it=>isPend(it) && !planMuerto(it));
    const imp = pend.filter(it=>it.vto < st.hoy).sort((a,b)=>a.vto<b.vto?-1:1);
    const fut = pend.filter(it=>it.vto >= st.hoy).sort((a,b)=>a.vto<b.vto?-1:1);
    const prox = fut[0]||null;
    let estado='ok', desde=null, cuotaLimite=null;
    if(imp.length >= r.limite){ estado='superado'; }
    else if(imp.length === r.limite-1 && prox){
      cuotaLimite = prox; desde = addDays(prox.vto, -r.dias);
      estado = st.hoy >= desde ? 'critica' : 'pronto';
    }
    out[k] = {...g, imp, prox, estado, desde, limite:r.limite,
      montoImp: imp.reduce((s,i)=>s+i.monto,0)};
  });
  return out;
}
function nivelDe(it, planes){
  if(it.tipo!=='egreso') return null;
  if(REGLAS[it.cat]){
    const p = planes[it.cat+'|'+it.emp+'|'+it.grupo];
    if(p && isPend(it) && !planMuerto(it)){
      if(p.estado==='superado') return 0;
      if(p.estado==='critica') return 1;
    }
  }
  return BASE[it.cat] ?? 4;
}

/* ====================== períodos ====================== */
function periodStart(iso, gran){
  const d=D(iso);
  if(gran==='dia') return iso;
  if(gran==='semana'){ const wd=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-wd); return I(d); }
  if(gran==='quincena'){ d.setUTCDate(d.getUTCDate()<=15?1:16); return I(d); }
  d.setUTCDate(1); return I(d);
}
function nextPeriod(iso, gran){
  const d=D(iso);
  if(gran==='dia'){ d.setUTCDate(d.getUTCDate()+1); return I(d); }
  if(gran==='semana'){ d.setUTCDate(d.getUTCDate()+7); return I(d); }
  if(gran==='quincena'){ if(d.getUTCDate()===1){ d.setUTCDate(16);} else { d.setUTCMonth(d.getUTCMonth()+1,1);} return I(d); }
  d.setUTCMonth(d.getUTCMonth()+1,1); return I(d);
}
function prevPeriod(iso, gran){
  const d=D(iso);
  if(gran==='dia'){ d.setUTCDate(d.getUTCDate()-1); return I(d); }
  if(gran==='semana'){ d.setUTCDate(d.getUTCDate()-7); return I(d); }
  if(gran==='quincena'){ if(d.getUTCDate()===16){ d.setUTCDate(1);} else { d.setUTCMonth(d.getUTCMonth()-1,16);} return I(d); }
  d.setUTCMonth(d.getUTCMonth()-1,1); return I(d);
}
function periodLabel(iso, gran){
  const d=D(iso); const dd=d.getUTCDate(), mm=d.getUTCMonth();
  if(gran==='dia') return DIA[d.getUTCDay()]+' '+dd+'/'+(mm+1);
  if(gran==='semana'){ const e=D(addDays(iso,6)); return dd+'/'+(mm+1)+' al '+e.getUTCDate()+'/'+(e.getUTCMonth()+1); }
  if(gran==='quincena') return (dd===1?'1ª ':'2ª ')+MES[mm]+' '+String(d.getUTCFullYear()).slice(2);
  return MES[mm].charAt(0).toUpperCase()+MES[mm].slice(1)+' '+String(d.getUTCFullYear()).slice(2);
}
const NPER = {dia:14, semana:10, quincena:8, mes:7};

// Normaliza nombres de cuenta para cruzar Caja y Bancos con la hoja de acuerdos
function normCta(t){ return String(t||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,''); }
function ultimo(serie){
  const ks = Object.keys(serie).filter(k=>k<=st.hoy).sort();
  return ks.length? {fecha:ks[ks.length-1], monto:serie[ks[ks.length-1]]} : null;
}
// Estado de caja de una empresa: cuenta por cuenta, con acuerdos
function caja(emp){
  const cs = (DATA.cuentas||[]).filter(c=>c.emp===emp);
  const acs = (DATA.acuerdos||[]).filter(a=>a.emp===emp);
  if(!cs.length && !acs.length) return null;
  let efectivo=0, usd=0, cheques=0, fecha=null; const bancos=[];
  const usados = new Set();
  cs.forEach(c=>{
    const u = ultimo(c.serie);
    const saldo = u? u.monto : 0;
    if(u && (!fecha || u.fecha>fecha)) fecha=u.fecha;
    if(c.tipo==='MONEDA EXTRANJERA'){ usd+=saldo; return; }
    if(c.tipo==='CHEQUES DE TERCEROS'){ cheques+=saldo; return; }
    if(c.tipo!=='BANCOS'){ efectivo+=saldo; return; }
    const ac = acs.find(a=>normCta(a.cuenta)===normCta(c.cuenta));
    if(ac) usados.add(ac);
    const acuerdo = ac? ac.monto : 0;
    const margen = saldo + acuerdo;
    bancos.push({cuenta:c.cuenta, saldo, acuerdo, vtoAc: ac?ac.vto:null, margen, fecha:u?u.fecha:null});
  });
  const sinCruce = acs.filter(a=>!usados.has(a) && a.monto);
  const saldoBancos = bancos.reduce((s,b)=>s+b.saldo,0);
  const totAcuerdos = bancos.reduce((s,b)=>s+b.acuerdo,0);
  const margenLibre = bancos.reduce((s,b)=>s+Math.max(b.margen,0),0);
  const excedido = bancos.reduce((s,b)=>s+Math.max(-b.margen,0),0);
  return {emp, fecha, filas: cs.map(c=>({tipo:c.tipo, cuenta:c.cuenta, u:ultimo(c.serie)})), efectivo, usd, cheques, bancos, sinCruce, saldoBancos, totAcuerdos, margenLibre, excedido,
    saldoReal: efectivo + saldoBancos,
    disponible: efectivo + margenLibre + cheques};
}
function dispHoy(emp){ const c=caja(emp); return c? {fecha:c.fecha, monto:c.disponible, caja:c} : null; }
function dispSel(){
  let tot=0, fechas=[], alguno=false;
  empsSel().forEach(e=>{ const d=dispHoy(e); if(d){ tot+=d.monto; if(d.fecha) fechas.push(d.fecha); alguno=true; } });
  return alguno? {monto:tot, fecha:fechas.sort()[0]} : null;
}
// Lo que se pasó del acuerdo en cada cuenta se trata como un pago crítico de hoy
function sinteticos(){
  const out=[];
  EMPRESAS.forEach(e=>{ const c=caja(e); if(!c) return;
    c.bancos.forEach(b=>{ if(b.margen < -1) out.push({emp:e, socio:'', tipo:'egreso', cat:'Excedido de acuerdo', grupo:b.cuenta,
      det:b.cuenta+(b.acuerdo?' (acuerdo '+money(b.acuerdo)+', saldo '+money(b.saldo)+')':' (sin acuerdo, saldo '+money(b.saldo)+')'),
      vto:st.hoy, fp:st.hoy, monto:-b.margen, pagado:false, sintetico:true}); });
  });
  return out;
}

/* ---------- Cash flow ---------- */
let CF_CELLS = {};
function renderCF(){
  const planes = evaluarPlanes();
  const gran = st.gran, proy = st.modo==='proy';
  const n = NPER[gran];
  const cols = [];
  if(proy){ let p = periodStart(st.hoy, gran); for(let i=0;i<n;i++){ cols.push(p); p=nextPeriod(p,gran); } }
  else { let p = periodStart(st.hoy, gran); for(let i=0;i<n;i++){ cols.unshift(p); p=prevPeriod(p,gran); } }
  const ends = cols.map((c,i)=> i<cols.length-1 ? addDays(cols[i+1],-1) : addDays(nextPeriod(c,gran),-1));
  const colOf = iso => { for(let i=0;i<cols.length;i++){ if(iso>=cols[i] && iso<=ends[i]) return i; } return -1; };
  const NC = cols.length + (proy?1:0); // columna 0 = atrasado
  const cells = {}; // key -> array of {m, items}
  const add = (key, ci, it)=>{ const a = cells[key] = cells[key] || Array.from({length:NC},()=>({m:0,items:[]})); a[ci].m+=it.monto; a[ci].items.push(it); };

  ITEMS.forEach(it=>{
    if(!empOk(it)) return;
    if(it.proyectado && !st.proy) return;
    if(proy){
      if(!isPend(it) || planMuerto(it)) return;
      let ci;
      if(it.fp < st.hoy) ci = 0; else { const c = colOf(it.fp); if(c<0) return; ci = c+1; }
      if(it.tipo==='ingreso'){ add('ing|'+it.cat, ci, it); add('ing', ci, it); if(it.tramo) add('ing|'+it.cat+'|'+it.tramo, ci, it); }
      else {
        const nv = nivelDe(it, planes);
        add('egr', ci, it);
        if(st.agrupar==='prio'){ add('egr|'+nv, ci, it); add('egr|'+nv+'|'+it.cat, ci, it); }
        else add('egr|'+it.cat, ci, it);
      }
    } else {
      if(it.tipo!=='egreso' || !isPaid(it)) return;
      const c = colOf(it.fp); if(c<0) return;
      add('egr', c, it); add('egr|'+it.cat, c, it);
    }
  });
  CF_CELLS = cells;
  const get = k => cells[k] || Array.from({length:NC},()=>({m:0,items:[]}));

  const ctrl = `<div class="bar">
    <div class="seg" id="granSeg">${[['dia','Diario'],['semana','Semanal'],['quincena','Quincenal'],['mes','Mensual']].map(([k,l])=>`<button aria-pressed="${gran===k}" data-g="${k}">${l}</button>`).join('')}</div>
    <div class="seg" id="modoSeg"><button aria-pressed="${proy}" data-m="proy">Lo que viene</button><button aria-pressed="${!proy}" data-m="hist">Lo pagado</button></div>${ii('modo')}
    ${proy?`<div class="seg" id="agrSeg"><button aria-pressed="${st.agrupar==='prio'}" data-a="prio">Egresos por prioridad</button><button aria-pressed="${st.agrupar==='rubro'}" data-a="rubro">Egresos por rubro</button></div>`:''}
    <label class="inline"><input type="checkbox" id="chkProy" ${st.proy?'checked':''}> Incluir OV y OC sin facturar y ventas futuras${ii('proyectados')}</label>
    ${proy?`<label class="inline"><input type="checkbox" id="chkArr" ${st.arrastre?'checked':''}> Descontar lo atrasado del saldo${ii('arrastre')}</label>`:''}
  </div>`;

  let head = `<tr><th class="first">En millones de $${ii(proy?'cfGrilla':'cfPagado')}</th>${proy?`<th class="n lateh">Atrasado${ii('cfAtrasado')}</th>`:''}${cols.map(c=>`<th class="n">${periodLabel(c,gran)}</th>`).join('')}</tr>`;
  const cell = (key, ci, extra='') => { const v = get(key)[ci].m; return `<td class="c ${Math.abs(v)<5000?'z':''} ${extra}" data-k="${esc(key)}" data-c="${ci}">${mill(v)}</td>`; };
  const rowCells = (key, cls='') => { let s=''; for(let ci=0;ci<NC;ci++) s+=cell(key,ci,(proy&&ci===0?'late ':'')+cls); return s; };
  let body = '';
  const sg = key => (st.abiertos[key]? '▾':'▸');

  if(proy){
    const disp = dispSel();
    const d0 = disp? disp.monto:0;
    // saldos
    const ingA = get('ing').map(x=>x.m), egrA = get('egr').map(x=>x.m);
    const ini=[], fin=[];
    for(let ci=0;ci<NC;ci++){
      ini[ci] = ci===0? d0 : fin[ci-1];
      const cuenta = ci>0 || st.arrastre;
      fin[ci] = ini[ci] + (cuenta? ingA[ci] - egrA[ci] : 0);
    }
    const numRow = (label, arr, cls='') => `<tr class="${cls}"><td class="first">${label}</td>${arr.map((v,ci)=>`<td class="n ${v<0?'neg':''} ${cls.includes('saldo')?'c':''} ${ci===0?'late':''}">${mill(v)}</td>`).join('')}</tr>`;
    body += `<tr><td class="first"><button class="tog" data-open="ini">${sg('ini')}</button>Saldo inicial${ii('saldoIni')}${disp?' <span class="hint">(Caja y Bancos al '+fdate(disp.fecha)+')</span>':''}</td>${ini.map((v,ci)=>`<td class="n ${v<0?'neg':''} ${ci===0&&proy?'late':''}">${mill(v)}</td>`).join('')}</tr>`;
    if(st.abiertos.ini) body += filasSaldoInicial(NC);
    body += `<tr class="sec"><td class="first"><button class="tog" data-open="ing">${sg('ing')}</button>Ingresos${ii('ingresos')}</td>${rowCells('ing')}</tr>`;
    if(st.abiertos.ing) ING_ORDEN.forEach(c=>{
      if(c==='Deudores por ventas'){
        const conT = TRAMOS.filter(t=>cells['ing|'+c+'|'+t]);
        body += `<tr class="sub"><td class="first">${conT.length?`<button class="tog" data-open="deu">${sg('deu')}</button>`:''}${c}${iiCat(c)}${fuenteTag('cobranzas')}</td>${rowCells('ing|'+c)}</tr>`;
        if(st.abiertos.deu) conT.forEach(t=>{ body += `<tr class="sub2"><td class="first">${TRAMO_LBL[t]}${ii('tr'+TRAMOS.indexOf(t))}</td>${rowCells('ing|'+c+'|'+t)}</tr>`; });
        return;
      }
      const etapa2 = c==='OV sin facturar' ? 'Etapa 2: Odoo' : 'Etapa 2: Planificación de Ventas';
      body += `<tr class="sub"><td class="first">${c}${iiCat(c)}<span class="tag2">${etapa2}</span>${st.proy?'':' <span class="hint">(tildá "Incluir OV…" para sumarlo)</span>'}</td>${rowCells('ing|'+c)}</tr>`;
    });
    body += `<tr class="sec"><td class="first"><button class="tog" data-open="egr">${sg('egr')}</button>Egresos${ii('egresos')}</td>${rowCells('egr')}</tr>`;
    if(st.abiertos.egr){
      if(st.agrupar==='prio'){
        NIVELES.forEach(nv=>{
          const k='egr|'+nv.id; if(!cells[k]) return;
          const ok = 'n'+nv.id;
          body += `<tr class="sub"><td class="first"><button class="tog" data-open="${ok}">${sg(ok)}</button><span class="dot d${nv.id}"></span>${nv.nombre}${ii('niv'+nv.id)}</td>${rowCells(k)}</tr>`;
          if(st.abiertos[ok]) EGR_ORDEN.forEach(c=>{ const kk=k+'|'+c; if(cells[kk]) body += `<tr class="sub2"><td class="first">${c}${iiCat(c)}${c==='Proveedores'?fuenteTag('proveedores'):''}</td>${rowCells(kk)}</tr>`; });
        });
      } else {
        EGR_ORDEN.forEach(c=>{ const kk='egr|'+c; if(cells[kk]) body += `<tr class="sub"><td class="first"><span class="dot d${BASE[c]??4}"></span>${c}${iiCat(c)}${c==='Proveedores'?fuenteTag('proveedores'):''}</td>${rowCells(kk)}</tr>`; });
      }
    }
    const net = ingA.map((v,i)=>v-egrA[i]);
    body += numRow('Neto del período'+ii('neto'), net, 'tot');
    body += numRow('Saldo final proyectado'+ii('saldoFin'), fin, 'saldo');
  } else {
    body += `<tr class="sec"><td class="first">Pagado</td>${rowCells('egr')}</tr>`;
    EGR_ORDEN.forEach(c=>{ const kk='egr|'+c; if(cells[kk]) body += `<tr class="sub"><td class="first"><span class="dot d${BASE[c]??4}"></span>${c}${iiCat(c)}</td>${rowCells(kk)}</tr>`; });
  }

  const note = proy
    ? `Hacé clic en cualquier número para ver qué lo compone. "Atrasado" es lo que tenía fecha prevista de pago antes del ${fdate(st.hoy)} y sigue sin pagar (Cancelado = NO). El saldo parte del disponible de hoy: margen de acuerdos, efectivo y cheques en cartera según Caja y Bancos (lo que se pasó del acuerdo figura como pago crítico)${st.arrastre?' y supone que se paga todo lo atrasado primero':' y deja lo atrasado afuera, para ver solo el flujo de lo que viene'}.${!st.proy?' Las proyecciones comerciales (OV/OC sin facturar, ventas futuras) están excluidas.':''}`
    : `Lo marcado como pagado en cada hoja, por fecha de pago. Los cheques propios cuentan como pagados cuando pasa su fecha. Los cobros de clientes se van a registrar en el panel de Cobranzas.`;
  const el = document.getElementById('tab-cf');
  el.innerHTML = ctrl + `<div class="tw"><table class="cf nosort"><thead>${head}</thead><tbody>${body}</tbody></table></div><p class="hint">${note}</p>`;
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ st.gran=b.dataset.g; renderAll(); });
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ st.modo=b.dataset.m; renderAll(); });
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ st.agrupar=b.dataset.a; renderAll(); });
  el.querySelector('#chkProy').onchange=e=>{ st.proy=e.target.checked; renderAll(); };
  const ca=el.querySelector('#chkArr'); if(ca) ca.onchange=e=>{ st.arrastre=e.target.checked; renderAll(); };
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const k=b.dataset.open; st.abiertos[k]=!st.abiertos[k]; renderCF(); });
  el.querySelectorAll('td[data-k]').forEach(td=>td.onclick=()=>{
    const k=td.dataset.k, ci=+td.dataset.c; const arr=CF_CELLS[k]; if(!arr || !arr[ci].items.length) return;
    const colName = proy ? (ci===0?'atrasado': periodLabel(cols[ci-1],gran)) : periodLabel(cols[ci],gran);
    showItems(labelKey(k)+', '+colName, arr[ci].items, planes);
  });
}
function labelKey(k){
  const p=k.split('|');
  if(p[0]==='ing') return (p[1]||'Ingresos')+(p[2]?' · '+(TRAMO_LBL[p[2]]||p[2]):'');
  if(p.length===1) return 'Egresos';
  if(/^\d$/.test(p[1])) return NIVELES[+p[1]].nombre + (p[2]?' · '+p[2]:'');
  return p[1];
}

/* ---------- Detalle ---------- */
function renderDet(){
  const planes = evaluarPlanes();
  const f = st.det;
  const cats = [...new Set(ITEMS.filter(i=>i.tipo==='egreso').map(i=>i.cat))].sort((a,b)=>EGR_ORDEN.indexOf(a)-EGR_ORDEN.indexOf(b));
  let its = ITEMS.filter(it=>it.tipo==='egreso' && empOk(it) && isPend(it) && !planMuerto(it));
  its.forEach(it=>it._n = nivelDe(it, planes));
  const q = f.q.trim().toLowerCase();
  if(q) its = its.filter(it=>(it.det+' '+it.grupo+' '+it.cat+' '+(it.nota||'')).toLowerCase().includes(q));
  if(f.cat) its = its.filter(it=>it.cat===f.cat);
  if(f.niv!=='') its = its.filter(it=>String(it._n)===f.niv);
  if(f.est==='venc') its = its.filter(it=>it.vto<st.hoy);
  if(f.est==='7') its = its.filter(it=>it.vto>=st.hoy && it.vto<=addDays(st.hoy,6));
  if(f.est==='30') its = its.filter(it=>it.vto>=st.hoy && it.vto<=addDays(st.hoy,29));
  its.sort((a,b)=>a._n-b._n || (a.vto<b.vto?-1:a.vto>b.vto?1:0));
  const tot = its.reduce((s,i)=>s+i.monto,0);
  const totV = its.filter(i=>i.vto<st.hoy).reduce((s,i)=>s+i.monto,0);
  const el=document.getElementById('tab-det');
  const keepFocus = document.activeElement && document.activeElement.id==='dq';
  el.innerHTML = `<div class="filters">
    <input id="dq" type="search" placeholder="Buscar acreedor, plan, banco, concepto…" value="${esc(f.q)}">
    <select id="dcat"><option value="">Todos los rubros</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select id="dniv"><option value="">Todas las prioridades</option>${NIVELES.map(n=>`<option value="${n.id}" ${f.niv===String(n.id)?'selected':''}>${n.nombre}</option>`).join('')}</select>
    <select id="dest"><option value="">Todos los vencimientos</option><option value="venc" ${f.est==='venc'?'selected':''}>Vencido</option><option value="7" ${f.est==='7'?'selected':''}>Vence en 7 días</option><option value="30" ${f.est==='30'?'selected':''}>Vence en 30 días</option></select>
  </div>
  <div class="totline"><b>${its.length}</b> deudas pendientes por <b>${money(tot)}</b>, de las cuales <b class="neg">${money(totV)}</b> ya vencieron.${ii('detTot')}</div>
  <div class="tw"><table><thead><tr><th>Prioridad${ii('prioridad')}</th><th>Empresa</th><th>Rubro${ii('rubro')}</th><th>Detalle${ii('detalle')}</th><th>Vence${ii('vence')}</th><th>Pago previsto${ii('pagoPrev')}</th><th class="n">Monto${ii('monto')}</th><th>Nota${ii('nota')}</th></tr></thead><tbody>
  ${its.slice(0,f.lim).map(it=>`<tr><td><span class="pill l${it._n}">${NIVELES[it._n].nombre}</span></td><td>${esc(it.emp)}${it.socio?' ('+esc(it.socio)+')':''}</td><td>${txtCat(it.cat)}</td><td class="wrapc">${it.sintetico?esc(it.det):lnk(it.cat,it.emp,it.grupo,esc(it.det))}</td><td class="${it.vto<st.hoy?'neg':''}">${fdate(it.vto)}</td><td>${fdate(it.fp)}</td><td class="n">${money(it.monto)}</td><td class="wrapc">${esc(it.nota||'')}</td></tr>`).join('')}
  ${!its.length?'<tr><td colspan="8">No hay deudas pendientes con estos filtros.</td></tr>':''}
  </tbody></table></div>
  ${its.length>f.lim?`<button class="btn more" id="dmore">Mostrar ${Math.min(200,its.length-f.lim)} más (hay ${its.length})</button>`:''}`;
  const dq=el.querySelector('#dq');
  dq.oninput=e=>{ f.q=e.target.value; f.lim=200; renderDet(); };
  if(keepFocus){ dq.focus(); dq.setSelectionRange(dq.value.length,dq.value.length); }
  el.querySelector('#dcat').onchange=e=>{ f.cat=e.target.value; f.lim=200; renderDet(); };
  el.querySelector('#dniv').onchange=e=>{ f.niv=e.target.value; f.lim=200; renderDet(); };
  el.querySelector('#dest').onchange=e=>{ f.est=e.target.value; f.lim=200; renderDet(); };
  const mb=el.querySelector('#dmore'); if(mb) mb.onclick=()=>{ f.lim+=200; renderDet(); };
}

function ii(k){ return `<i class="i" tabindex="0" data-info="${k}" aria-label="Información">i</i>`; }
function iiCat(c){ return INFO_CAT[c] ? `<i class="i" tabindex="0" data-info="cat:${esc(c)}" aria-label="De dónde sale">i</i>` : ''; }
function txtCat(c){ return INFO_CAT[c] ? `<span class="infotxt" tabindex="0" data-info="cat:${esc(c)}">${esc(c)}</span>` : esc(c); }
function infoHtml(k){
  if(k.startsWith('cat:')){ const c=k.slice(4); return `<div class="tt">${esc(c)}</div><div class="ts">De dónde sale</div>${esc(INFO_CAT[c]||'')}`; }
  if(k.startsWith('man:')){ return `<div class="tt">Cargado a mano</div>${esc(k.slice(4))}`; }
  const x = INFO[k]; if(!x) return '';
  return `<div class="tt">${esc(x.t)}</div>${x.d?`<div class="ts">De dónde sale</div>${esc(x.d)}`:''}${x.c?`<div class="ts">Cómo se calcula</div>${esc(x.c)}`:''}`;
}
(function(){
  const tip = document.getElementById('tip'); let fijo = null, actual = null;
  function mostrar(el){
    const html = infoHtml(el.dataset.info); if(!html) return;
    actual = el; tip.innerHTML = html; tip.style.display = 'block';
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8);
    let y = r.bottom + 8; if(y + hh > innerHeight - 8) y = Math.max(8, r.top - hh - 8);
    tip.style.left = x+'px'; tip.style.top = y+'px';
  }
  function ocultar(){ tip.style.display='none'; if(fijo){ fijo.classList.remove('on'); fijo=null; } }
  document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-info]'); if(el && !fijo) mostrar(el); });
  document.addEventListener('mouseout', e=>{ const el=e.target.closest('[data-info]'); if(el && !fijo) tip.style.display='none'; });
  document.addEventListener('focusin', e=>{ const el=e.target.closest('[data-info]'); if(el) mostrar(el); });
  document.addEventListener('focusout', e=>{ if(e.target.closest('[data-info]') && !fijo) tip.style.display='none'; });
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-info]');
    if(!el){ ocultar(); return; }
    e.preventDefault(); e.stopPropagation();
    if(fijo===el){ ocultar(); return; }
    ocultar(); fijo = el; el.classList.add('on'); mostrar(el);
  }, true);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') ocultar(); });
  addEventListener('scroll', ()=>{ if(tip.style.display==='block' && actual && actual.isConnected) mostrar(actual); }, true);
})();

/* ====================== Prioridades: caja, bancos y acuerdos ====================== */
function tablaCaja(emps){
  const orden = EMPRESAS.filter(e=>emps.includes(e));
  const cajas = orden.map(caja).filter(c=>c && c.filas.some(f=>f.u && Math.abs(f.u.monto)>=1));
  if(!cajas.length) return '';
  const td = (v,cls='') => `<td class="n ${cls} ${v<0?'neg':''}">${money(v)}</td>`;
  const fch = (u,c) => u ? `<td class="${u.fecha<c.fecha?'viejo':''}">${fdate(u.fecha)}</td>` : '<td>—</td>';
  let h = `<h2>Caja, bancos y acuerdos${ii('cajaTabla')}</h2><p class="h2sub">Saldos de la solapa Caja y Bancos, cuenta por cuenta. Disponible de un banco = acuerdo + saldo; si el saldo pasa el acuerdo, la diferencia hay que cubrirla (no se compensa con otro banco).</p>`;
  h += `<div class="tw"><table class="cb"><thead><tr><th>Cuenta</th><th class="n">Saldo${ii('cbSaldo')}</th><th class="n">Acuerdo${ii('cbAcuerdo')}</th><th class="n">Disponible${ii('cbDisp')}</th><th class="n">A cubrir${ii('cbCubrir')}</th><th>Último dato${ii('cbFecha')}</th></tr></thead><tbody>`;
  cajas.forEach(c=>{
    h += `<tr class="emp"><td colspan="6">${esc(c.emp)} · Caja y Bancos al ${fdate(c.fecha)}</td></tr>`;
    const bancos = c.bancos.filter(b=>Math.abs(b.saldo)>=1||b.acuerdo).sort((a,b)=>a.margen-b.margen);
    if(bancos.length){
      h += `<tr class="grp"><td colspan="6">Bancos</td></tr>`;
      bancos.forEach(b=>{
        const u = c.filas.find(f=>f.tipo==='BANCOS' && f.cuenta===b.cuenta);
        h += `<tr><td class="c1">${esc(b.cuenta)}${b.vtoAc?'<br><span class="hint">Acuerdo vence '+fdate(b.vtoAc)+'</span>':''}</td>${td(b.saldo)}<td class="n">${b.acuerdo?money(b.acuerdo):'—'}</td><td class="n">${b.margen>0?money(b.margen):'—'}</td><td class="n ${b.margen<-1?'neg':''}">${b.margen<-1?money(-b.margen):'—'}</td>${fch(u&&u.u,c)}</tr>`;
      });
    }
    const grupo = (tit, tipos) => {
      const fs = c.filas.filter(f=>tipos.includes(f.tipo) && f.u && Math.abs(f.u.monto)>=1);
      if(!fs.length) return;
      h += `<tr class="grp"><td colspan="6">${tit}</td></tr>`;
      fs.forEach(f=>{ h += `<tr><td class="c1">${esc(f.cuenta)}</td>${td(f.u.monto)}<td class="n">—</td>${td(f.u.monto)}<td class="n">—</td>${fch(f.u,c)}</tr>`; });
    };
    grupo('Efectivo', ['EFECTIVO','SALDO INICIAL','OTROS I']);
    grupo('Cheques de terceros en cartera', ['CHEQUES DE TERCEROS']);
    h += `<tr class="tot"><td>${esc(c.emp)}: total en pesos</td>${td(c.saldoReal + c.cheques)}<td class="n">${money(c.totAcuerdos)}</td>${td(c.disponible)}<td class="n">${c.excedido>1?money(c.excedido):'—'}</td><td></td></tr>`;
    const usd = c.filas.filter(f=>f.tipo==='MONEDA EXTRANJERA' && f.u && Math.abs(f.u.monto)>=1);
    if(usd.length){
      h += `<tr class="grp"><td colspan="6">Moneda extranjera (US$, no suma a los pesos)${ii('cbUsd')}</td></tr>`;
      usd.forEach(f=>{ h += `<tr class="usd"><td class="c1">${esc(f.cuenta)}</td><td class="n ${f.u.monto<0?'neg':''}">US$ ${nf0.format(Math.round(f.u.monto))}</td><td class="n">—</td><td class="n">—</td><td class="n">—</td>${fch(f.u,c)}</tr>`; });
      h += `<tr class="usdt"><td>${esc(c.emp)}: total US$</td><td class="n">US$ ${nf0.format(Math.round(c.usd))}</td><td colspan="4"></td></tr>`;
    }
  });
  h += `</tbody></table></div>`;
  const sc = cajas.flatMap(c=>c.sinCruce.map(a=>({...a})));
  if(sc.length) h += `<p class="hint">Acuerdos que no encontré en Caja y Bancos (revisar que el nombre de la cuenta sea igual): ${sc.map(a=>esc(a.emp+' · '+a.cuenta+' '+money(a.monto))).join('; ')}.</p>`;
  return h;
}

/* ====================== Caja y Bancos: base editable con historial ======================
   Fila "caja_v1" de la tabla cashflow: {cuentas:[{id,emp,tipo,cuenta,serie:{fecha:monto}}], acuerdos:[...],
   manual:{"id|fecha" ó "ac|emp|cuenta": {por,en}}, registro:[{en,por,dia,emp,cuenta,antes,despues,origen}]}.
   Los días no se borran nunca. Un Excel nuevo completa y actualiza lo que vino del Excel, pero no pisa
   lo cargado a mano. */
const ROW_CAJA = 'caja_v1';
const TIPOS_CAJA = ['EFECTIVO','SALDO INICIAL','OTROS I','BANCOS','CHEQUES DE TERCEROS','MONEDA EXTRANJERA'];
const TIPO_NOM = {'EFECTIVO':'Efectivo','SALDO INICIAL':'Saldo inicial','OTROS I':'Otros','BANCOS':'Bancos','CHEQUES DE TERCEROS':'Cheques de terceros en cartera','MONEDA EXTRANJERA':'Moneda extranjera (US$)'};
let CAJA = null;
const CJ = {dia:null, pend:{}, pendAc:{}, nuevas:[], dias:6, form:false};
function claveCta(c, n){ return c.emp+'|'+c.tipo+'|'+normCta(c.cuenta)+'|'+n; }
function conClaves(cuentas){ const cnt={}; return cuentas.map(c=>{ const b=c.emp+'|'+c.tipo+'|'+normCta(c.cuenta); cnt[b]=(cnt[b]||0)+1; return {c, k:b+'|'+cnt[b]}; }); }
function cajaDesdeExcel(d){
  return {cuentas:(d.cuentas||[]).map((c,i)=>({id:'c'+(i+1), emp:c.emp, tipo:c.tipo, cuenta:c.cuenta, serie:{...c.serie}})),
    acuerdos:(d.acuerdos||[]).map(a=>({...a})), manual:{}, registro:[]};
}
function aplicarCaja(d){ if(!CAJA) return; d.cuentas = CAJA.cuentas; d.acuerdos = CAJA.acuerdos; }
async function cargarCaja(d){
  CAJA = null;
  if(CONECTADO){
    try{ CAJA = await sbLeer(ROW_CAJA); }catch(e){ console.error('caja', e); }
    if(!CAJA){
      CAJA = cajaDesdeExcel(d);
      CAJA.registro.push({en:new Date().toISOString(), por:USUARIO.nombre||'', origen:'Excel', dia:'', emp:'', cuenta:'Caja y Bancos inicial desde '+((d.meta||{}).archivo||'el Excel'), antes:null, despues:null});
      if(PERM.editar){ try{ await sbGuardar(ROW_CAJA, CAJA); }catch(e){ console.error(e); } }
    }
  } else CAJA = cajaDesdeExcel(d);
  CAJA.manual = CAJA.manual||{}; CAJA.registro = CAJA.registro||[];
  aplicarCaja(d);
}
// Excel nuevo → se suma a Caja y Bancos sin pisar lo manual. Devuelve un texto para el aviso.
async function mezclarCajaExcel(d){
  let base = CAJA;
  if(CONECTADO){ try{ base = (await sbLeer(ROW_CAJA)) || CAJA; }catch(e){} }
  if(!base) base = {cuentas:[], acuerdos:[], manual:{}, registro:[]};
  base.manual = base.manual||{}; base.registro = base.registro||[];
  const idx = {}; conClaves(base.cuentas).forEach(x=>idx[x.k]=x.c);
  let nuevas=0, cambios=0, protegidos=0;
  conClaves(d.cuentas||[]).forEach(x=>{
    let c = idx[x.k];
    if(!c){ c = {id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), emp:x.c.emp, tipo:x.c.tipo, cuenta:x.c.cuenta, serie:{}}; base.cuentas.push(c); idx[x.k]=c; nuevas++; }
    Object.entries(x.c.serie).forEach(([f,v])=>{
      if(base.manual[c.id+'|'+f]){ if(c.serie[f]!==v) protegidos++; return; }
      if(c.serie[f]!==v){ c.serie[f]=v; cambios++; }
    });
  });
  (d.acuerdos||[]).forEach(a=>{
    const k='ac|'+a.emp+'|'+normCta(a.cuenta);
    const e = base.acuerdos.find(x=>x.emp===a.emp && normCta(x.cuenta)===normCta(a.cuenta));
    if(base.manual[k]) return;
    if(e){ e.monto=a.monto; e.vto=a.vto; } else base.acuerdos.push({...a});
  });
  base.registro.push({en:new Date().toISOString(), por:USUARIO.nombre||'', origen:'Excel', dia:'', emp:'', cuenta:'Importación '+((d.meta||{}).archivo||''), antes:null, despues:cambios+' saldos actualizados, '+nuevas+' cuentas nuevas'+(protegidos?', '+protegidos+' manuales respetados':'')});
  base.registro = base.registro.slice(-1500);
  CAJA = base; aplicarCaja(d);
  if(CONECTADO){ await sbGuardar(ROW_CAJA, CAJA); }
  return ' · Caja y Bancos: '+cambios+' saldos'+(protegidos?' ('+protegidos+' cargados a mano se respetaron)':'');
}
function diasCaja(){ const s=new Set(); (CAJA?CAJA.cuentas:[]).forEach(c=>Object.keys(c.serie).forEach(f=>s.add(f))); Object.keys(CJ.pend).forEach(k=>s.add(k.split('|')[1])); return [...s].sort(); }
function parseNum(t){
  let s=String(t||'').trim().replace(/\$|US\$|\s/g,''); if(s==='') return null;
  if(/,\d{1,2}$/.test(s) || (s.includes(',') && s.includes('.'))) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isNaN(n)? NaN : n;
}
const fmtIn = v => v==null||v===''? '' : (Math.round(v*100)/100).toLocaleString('es-AR',{maximumFractionDigits:2});
function valorDia(c, f){ const k=c.id+'|'+f; if(k in CJ.pend) return CJ.pend[k]; return c.serie[f]; }
function prevDia(c, f){ const ks=Object.keys(c.serie).filter(k=>k<f).sort(); return ks.length? {f:ks[ks.length-1], v:c.serie[ks[ks.length-1]]} : null; }
function hayPend(){ return Object.keys(CJ.pend).length + Object.keys(CJ.pendAc).length + CJ.nuevas.length; }

function renderCaja(){
  const el = document.getElementById('tab-caja');
  if(!CAJA){ el.innerHTML='<div class="empty">Todavía no hay datos de Caja y Bancos.</div>'; return; }
  const puede = PERM.editar;
  const dias = diasCaja();
  if(!CJ.dia) CJ.dia = dias.filter(f=>f<=st.hoy).pop() || dias[dias.length-1] || st.hoy;
  const ant = dias.filter(f=>f<CJ.dia).slice(-CJ.dias);
  const emps = EMPRESAS.filter(e=>empsSel().includes(e));

  });
  el.querySelectorAll('input.v[data-ac]').forEach(inp=>inp.onchange = ()=>{

  el.querySelector('#cjDesc').onclick = ()=>{ CJ.pend={}; CJ.pendAc={}; CJ.nuevas=[]; renderCaja(); };
  el.querySelector('#cjGuardar').onclick = guardarCaja;

function actualizarPend(){

async function guardarCaja(){
  const btn = document.getElementById('cjGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    let base = CAJA;
    if(CONECTADO){ try{ base = (await sbLeer(ROW_CAJA)) || CAJA; }catch(e){} }
    base.manual = base.manual||{}; base.registro = base.registro||[];
    const ahora = new Date().toISOString(), por = USUARIO.nombre||'';
    CJ.nuevas.forEach(c=>{ const x={...c}; delete x.nueva; base.cuentas.push(x);
      base.registro.push({en:ahora, por, origen:'Manual', dia:'', emp:c.emp, cuenta:'Cuenta nueva: '+c.cuenta+' ('+TIPO_NOM[c.tipo]+')', antes:null, despues:null}); });
    Object.entries(CJ.pend).forEach(([k,v])=>{
      const [id, dia] = k.split('|'); const c = base.cuentas.find(x=>x.id===id); if(!c) return;
      const antes = c.serie[dia] ?? null;
      if(v==null) delete c.serie[dia]; else c.serie[dia] = v;
      base.manual[k] = {por, en:ahora};
      base.registro.push({en:ahora, por, origen:'Manual', dia, emp:c.emp, cuenta:c.cuenta, antes, despues:v});
    });
    Object.entries(CJ.pendAc).forEach(([k,v])=>{
      const [emp, nc] = k.split('|'); let a = base.acuerdos.find(x=>x.emp===emp && normCta(x.cuenta)===nc);
      const cta = (base.cuentas.find(x=>x.emp===emp && normCta(x.cuenta)===nc)||{}).cuenta || nc;
      const antes = a? a.monto : null;
      if(a) a.monto = v; else base.acuerdos.push({emp, cuenta:cta, monto:v, vto:null});
      base.manual['ac|'+k] = {por, en:ahora};
      base.registro.push({en:ahora, por, origen:'Manual (acuerdo)', dia:'', emp, cuenta:'Acuerdo '+cta, antes, despues:v});
    });
    base.registro = base.registro.slice(-1500);
    if(CONECTADO) await sbGuardar(ROW_CAJA, base);
    else toast('Sin conexión: los cambios quedan solo en esta pantalla hasta recargar.');
    CAJA = base; CJ.pend={}; CJ.pendAc={}; CJ.nuevas=[];
    aplicarCaja(DATA); renderAll();
    if(CONECTADO){ actualizarResumen(true); toast('Caja y Bancos guardado para todos.'); }
  }catch(e){
    console.error(e); toast('No se pudo guardar: '+e.message);
    btn.disabled = false; btn.textContent = 'Guardar cambios';
  }
}

/* ====================== Datos de otros paneles: Cobranzas y Proveedores ======================
   Se leen igual que en la portada (tablas clientes, objetivos_cobranza y proveedores; candado.js las redirige
   al Supabase del portal con la sesión). Si no responden, se usan las hojas Clientes / Proveedores del Excel. */
const TRAMOS = ['Preventivo','Mora temprana','Mora media','Mora crítica'];
const TRAMO_LBL = {'Preventivo':'Preventivo (a vencer)','Mora temprana':'Mora temprana 1–15d','Mora media':'Mora media 16–45d','Mora crítica':'Mora crítica +45d'};
const PCT_DEF = {'Preventivo':100,'Mora temprana':70,'Mora media':40,'Mora crítica':15};
const PANELES = {cob:null, prov:null, pct:null, pctOrigen:'', errCob:'', errProv:'', cache:{}};
function tramoDias(d){ return d<=0?'Preventivo':d<=15?'Mora temprana':d<=45?'Mora media':'Mora crítica'; }
function empCorta(e){ e=String(e||'').toUpperCase(); return !e?'':e.includes('SPOTSLINE')?'Spotsline':e.includes('SPL')?'SPL':''; }
function jsonArr(v){ if(typeof v==='string'){ try{ v=JSON.parse(v); }catch(e){ v=[]; } } return Array.isArray(v)?v:[]; }
function isoFecha(v){ const s=String(v||'').slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null; }
async function leerTabla(q){ const r=await fetch(`${SUPABASE_URL}/rest/v1/${q}`,{headers:sbHeaders()}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function cargarPaneles(){
  PANELES.cache = {};
  try{
    const rows = await leerTabla('clientes?select=nombre,vendedor,empresa,facturas');
    if(!rows || !rows.length) throw new Error('sin datos (¿tu usuario tiene el panel de Cobranzas?)');
    PANELES.cob = rows.map(r=>({nombre:r.nombre||'', vendedor:r.vendedor||'', empresa:r.empresa||'', facturas:jsonArr(r.facturas)}));
    PANELES.errCob = '';
    const mes = isoLocal(new Date()).slice(0,7);
    let pct = null;
    try{ const f = await leerTabla(`objetivos_cobranza?id=eq.foto_${mes}&select=valor`); if(f&&f[0]&&f[0].valor&&f[0].valor.pct){ pct=f[0].valor.pct; PANELES.pctOrigen='objetivo fijado de '+mes; } }catch(e){}
    if(!pct){ try{ const p = await leerTabla('objetivos_cobranza?id=eq.porcentajes_mora&select=valor'); if(p&&p[0]&&p[0].valor){ pct=p[0].valor; PANELES.pctOrigen='% de cobro por tipo de deudor (base)'; } }catch(e){} }
    if(pct && !pct.general && !pct.vendedores) pct = {general:{}, vendedores:pct};
    PANELES.pct = pct || {general:{}, vendedores:{}};
    if(!pct) PANELES.pctOrigen = '% por defecto (100/70/40/15)';
  }catch(e){ PANELES.cob=null; PANELES.errCob = e.message; console.warn('cashflow: Cobranzas', e); }
  try{
    const rows = await leerTabla('proveedores?select=nombre,empresa,facturas,creditos');
    if(!rows || !rows.length) throw new Error('sin datos (¿tu usuario tiene el panel de Proveedores?)');
    PANELES.prov = rows.map(r=>({nombre:r.nombre||'', empresa:r.empresa||'', facturas:jsonArr(r.facturas), creditos:jsonArr(r.creditos)}));
    PANELES.errProv = '';
  }catch(e){ PANELES.prov=null; PANELES.errProv = e.message; console.warn('cashflow: Proveedores', e); }
}
function pctDe(vendedor, tramo){
  const cfg = PANELES.pct||{general:{},vendedores:{}}, ok = x=>x!==undefined&&x!==null&&x!==''&&!isNaN(parseFloat(x));
  const v = (cfg.vendedores||{})[vendedor]; if(v && ok(v[tramo])) return parseFloat(v[tramo]);
  const g = (cfg.general||{})[tramo]; return ok(g)? parseFloat(g) : PCT_DEF[tramo];
}
function fuenteTag(p){
  if(p==='cobranzas') return PANELES.cob ? `<span class="tag2 ok">Panel de Cobranzas</span>` : `<span class="tag2 warn" title="${esc(PANELES.errCob)}">Excel (Cobranzas no respondió)</span>`;
  if(p==='proveedores') return PANELES.prov ? `<span class="tag2 ok">Panel de Proveedores</span>` : `<span class="tag2 warn" title="${esc(PANELES.errProv)}">Excel (Proveedores no respondió)</span>`;
  return '';
}
// Facturas de clientes → cobros esperados. Las vencidas se reparten en las semanas que quedan del mes de la fecha de análisis.
function itemsCobranzas(hoy){
  const out = [];
  const finMes = addDays(I(new Date(Date.UTC(+hoy.slice(0,4), +hoy.slice(5,7), 1))), -1);
  const partes = []; for(let f=hoy; f<=finMes; f=addDays(f,7)) partes.push(f);
  PANELES.cob.forEach(c=>{
    c.facturas.forEach(f=>{
      const monto = +f.monto||0; if(monto<=0) return;
      const emp = empCorta(f.emp) || empCorta(c.empresa); if(!emp) return;
      const vto = isoFecha(f.vto);
      const dias = vto ? diffDays(hoy, vto) : 0;
      const tramo = tramoDias(dias), pct = pctDe(c.vendedor, tramo), esp = monto*pct/100;
      if(esp<1) return;
      const base = {emp, socio:'', tipo:'ingreso', cat:'Deudores por ventas', grupo:c.nombre, vto:vto||hoy, pagado:false, estado:'', origen:'cobranzas', tramo, pct, montoFac:monto, num:String(f.num||''),
        nota:(c.vendedor?'Vendedor: '+c.vendedor+' · ':'')+'factura '+money(monto)+' × '+pct+'%'};
      if(tramo==='Preventivo') out.push({...base, det:'Fc '+(f.num||'s/n')+' · '+pct+'% de '+money(monto), fp:vto||hoy, monto:esp});
      else partes.forEach((fp,i)=>out.push({...base, det:'Fc '+(f.num||'s/n')+' · '+dias+' días vencida · parte '+(i+1)+'/'+partes.length, fp, monto:esp/partes.length}));
    });
  });
  return out;
}
// Facturas de proveedores → pagos en su vencimiento. Saldos a favor descuentan las facturas más viejas de la misma empresa.
function itemsProveedores(hoy){
  const out = [];
  PANELES.prov.forEach(p=>{
    const fs = p.facturas.map(f=>({num:f.num, monto:+f.monto||0, vto:isoFecha(f.vto), emp:empCorta(f.emp)||empCorta(p.empresa)||'Spotsline'})).filter(f=>f.monto>0)
      .sort((a,b)=>(a.vto||'0')<(b.vto||'0')?-1:1);
    const cred = {}; p.creditos.forEach(c=>{ const e=empCorta(c.emp)||empCorta(p.empresa)||'Spotsline'; cred[e]=(cred[e]||0)+(+c.monto||0); });
    fs.forEach(f=>{ const c=cred[f.emp]||0; if(c>0){ const u=Math.min(c,f.monto); f.monto-=u; cred[f.emp]=c-u; } });
    fs.forEach(f=>{ if(f.monto<1) return;
      out.push({emp:f.emp, socio:'', tipo:'egreso', cat:'Proveedores', grupo:p.nombre, det:'Fc '+(f.num||'s/n'), vto:f.vto||hoy, fp:f.vto||hoy, monto:f.monto, pagado:false, estado:'', nota:'', origen:'proveedores', num:String(f.num||'')});
    });
  });
  return out;
}
function construirItems(){
  const k = st.hoy+'|'+(PANELES.cob?1:0)+(PANELES.prov?1:0);
  if(!PANELES.cache[k]) PANELES.cache = {[k]:[].concat(PANELES.cob?itemsCobranzas(st.hoy):[], PANELES.prov?itemsProveedores(st.hoy):[])};
  const base = DATA.items.filter(it=>it.cat!=='Cheques de terceros'
    && !(PANELES.cob && it.cat==='Deudores por ventas') && !(PANELES.prov && it.cat==='Proveedores'));
  return base.concat(PANELES.cache[k], sinteticos());
}

function filasSaldoInicial(NC){
  const cajas = EMPRESAS.filter(e=>empsSel().includes(e)).map(caja).filter(Boolean);
  const varias = cajas.length>1;
  const nom = (f,e)=> esc(f) + (varias?` <span class="hint">${esc(e)}</span>`:'');
  const vacias = n => '<td></td>'.repeat(n);
  const G = [
    {k:'efe', t:'Efectivo', i:'iniEfe', f:cajas.flatMap(c=>c.filas.filter(x=>['EFECTIVO','SALDO INICIAL','OTROS I'].includes(x.tipo)&&x.u&&Math.abs(x.u.monto)>=1).map(x=>({n:x.cuenta,e:c.emp,v:x.u.monto})))},
    {k:'ban', t:'Bancos (margen de acuerdos)', i:'iniBan', f:cajas.flatMap(c=>c.bancos.filter(b=>b.margen>=1).map(b=>({n:b.cuenta,e:c.emp,v:b.margen,x:'saldo '+money(b.saldo)+(b.acuerdo?' + acuerdo '+money(b.acuerdo):'')}))) },
    {k:'chq', t:'Cheques de terceros en cartera', i:'iniChq', f:cajas.flatMap(c=>c.filas.filter(x=>x.tipo==='CHEQUES DE TERCEROS'&&x.u&&Math.abs(x.u.monto)>=1).map(x=>({n:x.cuenta,e:c.emp,v:x.u.monto})))}
  ];
  let s = '';
  G.forEach(g=>{
    const tot = g.f.reduce((a,b)=>a+b.v,0), ok='ini|'+g.k;
    s += `<tr class="sub"><td class="first">${g.f.length?`<button class="tog" data-open="${ok}">${st.abiertos[ok]?'▾':'▸'}</button>`:''}${g.t}${ii(g.i)}</td><td class="n ini ${tot<0?'neg':''}">${mill(tot)}</td>${vacias(NC-1)}</tr>`;
    if(st.abiertos[ok]) g.f.sort((a,b)=>b.v-a.v).forEach(x=>{ s += `<tr class="sub3"><td class="first" title="${esc(x.x||'')}">${nom(x.n,x.e)}</td><td class="n ${x.v<0?'neg':''}">${mill(x.v)}</td>${vacias(NC-1)}</tr>`; });
  });
  const usd = cajas.flatMap(c=>c.filas.filter(x=>x.tipo==='MONEDA EXTRANJERA'&&x.u&&Math.abs(x.u.monto)>=1).map(x=>({n:x.cuenta,e:c.emp,v:x.u.monto})));
  if(usd.length){
    const tot = usd.reduce((a,b)=>a+b.v,0);
    s += `<tr class="sub"><td class="first"><button class="tog" data-open="ini|usd">${st.abiertos['ini|usd']?'▾':'▸'}</button>Moneda extranjera <span class="hint">(no suma)</span>${ii('iniUsd')}</td><td class="n" style="color:var(--pos)">US$ ${nf0.format(Math.round(tot))}</td>${vacias(NC-1)}</tr>`;
    if(st.abiertos['ini|usd']) usd.forEach(x=>{ s += `<tr class="sub3"><td class="first">${nom(x.n,x.e)}</td><td class="n" style="color:var(--pos)">US$ ${nf0.format(Math.round(x.v))}</td>${vacias(NC-1)}</tr>`; });
  }
  return s;
}

function verGrupo(cat, emp, grupo){

    <div><small>Vencido impago</small><b class="${ven.length?'neg':''}">${money(sum(ven))}</b><br><span class="hint">${ven.length}</span></div>
    <div><small>Próxima</small><b>${prox?fdate(prox.vto):'—'}</b><br><span class="hint">${prox?money(prox.monto):''}</span></div>
  </div>
  <div class="tw"><table><thead><tr><th>Detalle</th><th>Vence</th><th>Pago previsto</th><th class="n">Monto</th><th>Estado</th><th>Nota</th></tr></thead><tbody>
  ${its.map(i=>`<tr class="${pag.includes(i)?'pag':''}"><td class="wrapc">${esc(i.det)}</td><td>${fdate(i.vto)}</td><td>${fdate(i.fp)}</td><td class="n">${money(i.monto)}</td><td>${estado(i)}</td><td class="wrapc">${esc(i.nota||i.estado||'')}</td></tr>`).join('') || '<tr><td colspan="6">Sin movimientos.</td></tr>'}
